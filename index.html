// ---- 順位推移（バンプチャート） ----
// ESPNは節ごとの順位表を返さないため、リーグ全体の日程（試合結果タブと共用のキャッシュ）を
// 積み上げて自前で再現する。最終時点の結果が公式の順位表と一致することを確認済み。
//
// 節の復元（buildRounds）は使わない。延期試合があると節番号が本来の時系列と前後し、
// 日付軸に並べたときに月が行ったり来たりしてしまうため。
// 代わりに消化済みの試合を日付順に並べ、3日以上空いたところで区切って1点とする。
async function buildRankHistory() {
    const info   = await getSeasonInfo();
    const league = (await getLeagueScoreboard(info.start).catch(() => []))
                       .filter(ev => isCurrentSeason(ev, info));

    const val  = c => (c?.score?.value != null ? Math.round(c.score.value) : NaN);
    const done = league
        .filter(ev => eventStatus(ev).done)
        .map(ev => ({ ev, cs: ev.competitions?.[0]?.competitors || [], date: eventDateInfo(ev).date }))
        .filter(x => x.cs.length >= 2 && !isNaN(val(x.cs[0])) && !isNaN(val(x.cs[1])))
        .sort((a, b) => a.date - b.date);

    const tbl  = new Map();   // teamId → { team, pts, gf, ga }
    const hist = [];          // [{ date, order: [teamId…] }] 日付昇順・順位順
    let group  = [];

    const flush = () => {
        if (!group.length) return;
        group.forEach(({ cs }) => {
            [[cs[0], cs[1]], [cs[1], cs[0]]].forEach(([x, y]) => {
                const id = x.team?.id;
                if (!id) return;
                const t = tbl.get(id) || { team: x.team, pts: 0, gf: 0, ga: 0 };
                t.team = x.team;
                t.gf  += val(x);
                t.ga  += val(y);
                t.pts += val(x) > val(y) ? 3 : val(x) === val(y) ? 1 : 0;
                tbl.set(id, t);
            });
        });
        const order = [...tbl.entries()]
            .sort((p, q) => q[1].pts - p[1].pts
                         || (q[1].gf - q[1].ga) - (p[1].gf - p[1].ga)
                         || q[1].gf - p[1].gf)
            .map(([id]) => id);
        hist.push({ date: group[group.length - 1].date, order });
        group = [];
    };

    done.forEach(x => {
        if (group.length && x.date - group[group.length - 1].date >= 3 * 86400000) flush();
        group.push(x);
    });
    flush();

    return { hist, tbl, total: info.teamCount || tbl.size };
}

// 順位表の見出しから開閉する。初回に開いたときだけ組み立てる。
let rankChartBuilt = false;
async function toggleRankChart() {
    const slot = document.getElementById('rank-chart');
    const btn  = document.getElementById('rank-toggle');
    if (!slot || !btn) return;

    if (!slot.hasAttribute('hidden')) {          // 開いている → 閉じる
        slot.setAttribute('hidden', '');
        btn.classList.remove('open');
        btn.textContent = '📈 順位推移';
        return;
    }
    slot.removeAttribute('hidden');
    btn.classList.add('open');
    btn.textContent = '📈 閉じる';
    if (rankChartBuilt) return;

    slot.innerHTML = '<div class="mw-preview-loading"><div class="spinner"></div></div>';
    try {
        const d = await buildRankHistory();
        slot.innerHTML = buildRankChart(d, slot.clientWidth)
            || '<div class="sch-note">2節以上消化すると順位推移を表示できます</div>';
        rankChartBuilt = true;
    } catch(e) {
        slot.innerHTML = '<div class="error-box">順位推移を取得できませんでした</div>';
    }
}

const RANK_COLORS = ['#FFD700', '#4fc3f7', '#ab7df8', '#ff8a65'];
const ymLabel = d => d ? `${d.getFullYear()}年${d.getMonth() + 1}月` : '';

function buildRankChart({ hist, tbl, total }, avail) {
    if (hist.length < 2) return '';   // 2節以上ないと推移にならない

    // 柏＋現在の上位3クラブ
    const latest = hist[hist.length - 1].order;
    const picks  = [TEAM_ID, ...latest.filter(id => id !== TEAM_ID).slice(0, 3)]
                       .filter(id => latest.includes(id));

    const PAD_L = 24, PAD_R = 26, PAD_T = 14, PAD_B = 20, ROW = 14;
    const span  = hist.length - 1;
    const width = Math.max(avail || 340, 280);
    // 既定は横幅いっぱいに広げ、節が増えて24pxを切ったら横スクロールに切り替わる
    const STEP  = Math.min(160, Math.max(24, (width - PAD_L - PAD_R) / span));
    const W = Math.round(PAD_L + PAD_R + span * STEP);
    const H = PAD_T + PAD_B + (total - 1) * ROW;
    const x = i => +(PAD_L + i * STEP).toFixed(1);
    const y = r => +(PAD_T + (r - 1) * ROW).toFixed(1);
    const dur = Math.min(2.2, Math.max(0.9, hist.length * 0.12));

    // 上位3／下位3のゾーンと目盛り
    let bg = `<rect class="rank-zone-top" x="0" y="${y(1) - ROW / 2}" width="${W}" height="${ROW * 3}"/>` +
             `<rect class="rank-zone-rel" x="0" y="${y(total - 2) - ROW / 2}" width="${W}" height="${ROW * 3}"/>`;
    for (let r = 1; r <= total; r += (r === 1 ? 4 : 5)) {
        bg += `<line class="rank-grid" x1="${PAD_L}" y1="${y(r)}" x2="${W - PAD_R}" y2="${y(r)}"/>` +
              `<text class="rank-axis" x="${PAD_L - 7}" y="${y(r) + 3}" text-anchor="end">${r}</text>`;
    }
    // 横軸は日付。ESPNは節番号を返さず buildRounds の復元は延期試合でずれるため、
    // 月が変わった最初の点にだけ「M月」を置く（間隔が詰まる場合は間引く）。
    let prevMonth = '', lastX = -999;
    hist.forEach((h, i) => {
        if (!h.date) return;
        const key = `${h.date.getFullYear()}-${h.date.getMonth()}`;
        if (key === prevMonth) return;
        prevMonth = key;
        if (x(i) - lastX < 30) return;
        lastX = x(i);
        bg += `<line class="rank-grid" x1="${x(i)}" y1="${PAD_T - 4}" x2="${x(i)}" y2="${H - PAD_B + 2}"/>` +
              `<text class="rank-axis" x="${x(i)}" y="${H - 6}" text-anchor="middle">${h.date.getMonth() + 1}月</text>`;
    });

    // 線は後ろ、エンブレムは前。柏を最後に描いて最前面へ
    const rankOf = (id, i) => hist[i].order.indexOf(id) + 1;
    let lines = '', dots = '';
    picks.forEach((id, n) => {
        const me    = id === TEAM_ID;
        const color = RANK_COLORS[n % RANK_COLORS.length];
        const size  = me ? 21 : 15;
        const pts   = hist.map((_, i) => `${x(i)},${y(rankOf(id, i))}`).join(' ');
        lines += `<polyline class="rank-line" points="${pts}" stroke="${color}" stroke-width="${me ? 3 : 2}" opacity="${me ? 1 : 0.75}"/>`;
        const logo = getLogo(tbl.get(id)?.team) || LOGO(id);
        dots += hist.map((_, i) => {
            const delay = (span ? i / span : 0) * dur;
            return `<image class="rank-dot" href="${logo}" x="${x(i) - size / 2}" y="${y(rankOf(id, i)) - size / 2}"` +
                   ` width="${size}" height="${size}" preserveAspectRatio="xMidYMid meet"` +
                   ` style="animation-delay:${delay.toFixed(2)}s"/>`;
        }).join('');
    });

    const legend = picks.map((id, n) => {
        const t = tbl.get(id);
        return `<span class="rank-chip${id === TEAM_ID ? ' me' : ''}">
            <span class="swatch" style="background:${RANK_COLORS[n % RANK_COLORS.length]}"></span>
            <img src="${getLogo(t?.team) || LOGO(id)}" alt="" onerror="this.style.display='none'">
            ${toJP(t?.team?.displayName || '')}<b>${rankOf(id, hist.length - 1)}位</b></span>`;
    }).join('');

    return `
    <div class="rank-chart">
        <div class="section-label">順位推移　${ymLabel(hist[0].date)} → ${ymLabel(hist[hist.length - 1].date)}</div>
        <div class="rank-scroll">
            <svg class="rank-svg" width="${W}" height="${H}" style="--dur:${dur}s" role="img"
                 aria-label="柏レイソルと上位クラブの順位推移">
                ${bg}${lines}${dots}
            </svg>
        </div>
        <div class="rank-legend">${legend}</div>
    </div>`;
}

// ---- 順位表 ----
// ---- 他大会のデータ ----
// ESPNが順位表を持っているのはACLだけなので、残りは大会の主催者側から取る：
//   ルヴァン → Jリーグのデータサイト（検索結果のHTMLテーブル）
//   天皇杯   → JFAの日程JSON（公式ページのjQueryプラグインが読んでいるもの）
// どちらもCORSを許可していないため、チケット情報と同じく r.jina.ai を経由する。
// r.jina.ai は本文の前に Title / URL Source などの行を足すので、JSONは最初の { から読む。
const COMPETITIONS = [
    { key: 'j1',      label: 'J1リーグ' },
    { key: 'acl',     label: 'ACLエリート' },
    { key: 'levain',  label: 'ルヴァンカップ' },
    { key: 'emperor', label: '天皇杯' },
];

const ACL_STANDINGS_URL = 'https://site.web.api.espn.com/apis/v2/sports/soccer/afc.champions/standings?type=0';
const LEVAIN_PAGE  = y => `https://data.j-league.or.jp/SFMS01/search?competition_years=${y}&competition_frame_ids=11`;
const EMPEROR_JSON = y => `https://www.jfa.jp/match/emperorscup_${y}/match/schedule.json`;

const compCache = {};
function loadCompetition(key) {
    if (!compCache[key]) compCache[key] = fetchCompetition(key);
    return compCache[key];
}

async function fetchCompetition(key) {
    // 大会年はシーズン開始年。年を跨ぐ大会もシーズン開始年で登録されている
    const info = await getSeasonInfo();
    if (key === 'acl') {
        const res = await fetch(ACL_STANDINGS_URL);
        if (!res.ok) throw new Error('ACLの順位表を取得できませんでした');
        return res.json();
    }
    if (key === 'emperor') {
        const res = await fetch(TICKET_PROXY + EMPEROR_JSON(info.year));
        if (!res.ok) throw new Error('天皇杯の日程を取得できませんでした');
        const raw = await res.text();
        return parseEmperor(JSON.parse(raw.slice(raw.indexOf('{'))));
    }
    const res = await fetch(TICKET_PROXY + LEVAIN_PAGE(info.year));
    if (!res.ok) throw new Error('ルヴァンカップの日程を取得できませんでした');
    return parseLevain(await res.text());
}

// ラウンドは勝ち上がりの順に並べる。開催日順ではない点に注意：
// ルヴァンはACL出場クラブが4回戦から登場するため、4回戦(10/3)が3回戦(10/14)より先に行われる。
const ROUND_SEQ = ['１回戦', '２回戦', '３回戦', '４回戦', '５回戦', '６回戦',
                   'ラウンド16', '準々決勝', '準決勝', '決勝'];
const roundOrder = name => {
    const i = ROUND_SEQ.findIndex(r => String(name).includes(r));
    return i < 0 ? ROUND_SEQ.length : i;
};

function groupRounds(matches) {
    const map = new Map();
    matches.forEach(m => {
        if (!map.has(m.round)) map.set(m.round, []);
        map.get(m.round).push(m);
    });
    return [...map.entries()]
        .map(([round, list]) => ({ round, matches: list }))
        .sort((a, b) => roundOrder(a.round) - roundOrder(b.round));
}

const numOrNull = v => (v === '' || v == null ? null : Number(v));

// 「No.71の勝者」「[39]w」＝まだ決まっていない枠。番号がそのまま前の試合を指しているので、
// トーナメント表の枝はこれを辿って組む（bracketLayout）。
const winnerRef  = re => s => { const m = re.exec(String(s ?? '')); return m ? +m[1] : null; };
const winnerName = re => s => { const m = re.exec(String(s ?? '')); return m ? `No.${+m[1]} 勝者` : String(s ?? ''); };

const EMP_REF = /No\.(\d+)\s*の勝者/;
const empRef  = winnerRef(EMP_REF);
const empName = winnerName(EMP_REF);

// JFAの日程JSON。未確定の対戦は「No.71の勝者」、未定の日付は「未定」で入っている
function parseEmperor(data) {
    const list = data.matchScheduleList?.matchSchedule || [];
    return groupRounds(list.map(m => {
        const s  = m.score || {};
        const md = String(m.matchDate || '').match(/(\d{1,2})\/(\d{1,2})$/);
        return {
            round:  m.matchTypeName || '',
            no:     numOrNull(m.matchNumber),
            date:   md ? `${+md[1]}/${+md[2]}` : '',
            home:   empName(m.homeTeamName),
            away:   empName(m.awayTeamName),
            srcH:   empRef(m.homeTeamName),
            srcA:   empRef(m.awayTeamName),
            hs:     numOrNull(s.homeScore),
            as:     numOrNull(s.awayScore),
            hpk:    numOrNull(s.homePKScore),
            apk:    numOrNull(s.awayPKScore),
            winner: s.homeWinFlag ? 'home' : s.awayWinFlag ? 'away' : null,
        };
    }));
}

// r.jina.ai が返すマークダウンの表を読む。
// 列は シーズン|大会|節|試合日|K/O|ホーム|スコア|アウェイ|スタジアム|入場者数|備考 で、
// セルはリンク記法（[柏](url)）になっているので表記だけを取り出す。
// 末尾の備考には「マッチＮｏ［２４］」（全角）が入っていて、これがトーナメント表の枝になる。
const LEV_REF = /^\[(\d+)\]w$/;
const levRef  = winnerRef(LEV_REF);
const levName = winnerName(LEV_REF);
const zen2han = s => String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));

function parseLevain(md) {
    const cell = s => s.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').trim();
    const out  = [];

    md.split('\n').forEach(line => {
        if (!line.startsWith('|')) return;
        const c = line.split('|').slice(1, -1).map(cell);
        if (c.length < 9) return;

        const d = c[3].match(/(\d{2})\/(\d{1,2})\/(\d{1,2})/);   // 26/09/02(水)
        if (!d) return;                                          // 見出し行・区切り行を弾く

        const sc  = c[6].match(/^(\d+)\s*-\s*(\d+)/);          // 「0-0 (PK3-1)」「vs」
        const pk  = c[6].match(/PK\s*(\d+)\s*-\s*(\d+)/);
        const hs  = sc ? +sc[1] : null;
        const as  = sc ? +sc[2] : null;
        const hpk = pk ? +pk[1] : null;
        const apk = pk ? +pk[2] : null;

        let winner = null;
        if (hs !== null) winner = hs > as ? 'home' : as > hs ? 'away'
                                : hpk !== null ? (hpk > apk ? 'home' : 'away') : null;

        // 「ＹＬＣ 1stラウンド」＋「４回戦第１日」→「1stラウンド ４回戦」
        const stage = c[1].replace(/^ＹＬＣ\s*/, '').trim();
        const sec   = c[2].replace(/第[０-９0-9一二三四五六七八九十]+日$/, '').trim();

        const mn = (c[10] || '').match(/マッチＮｏ［([^］]+)］/);

        out.push({
            round: [stage, sec].filter(Boolean).join('　'),
            no:    mn ? +zen2han(mn[1]) : null,
            date:  `${+d[2]}/${+d[3]}`,
            at:    new Date(2000 + +d[1], +d[2] - 1, +d[3]).getTime(),
            home:  levName(c[5]), away: levName(c[7]),
            srcH:  levRef(c[5]),  srcA:  levRef(c[7]),
            hs, as, hpk, apk, winner,
        });
    });
    // データサイトはラウンド順に返してくれないので、開催日順に並べ直してからまとめる
    return groupRounds(out.sort((a, b) => a.at - b.at));
}

// ---- トーナメント表 ----
const isKashiwa = n => n === '柏' || String(n || '').includes('柏レイソル');

// 箱の大きさと列の間隔。連結線もこの値から引くので、CSSではなくここが基準
const BRK_W     = 160;                 // 箱の幅
const BRK_H     = 58;                  // 箱の高さ
const BRK_GAP   = 46;                  // 列と列の間（連結線を通す幅）
const BRK_PITCH = BRK_H + 12;          // 同じ列で箱を並べるときの最小間隔

const brkKids = m => [m.kidH, m.kidA].filter(Boolean);

// 各枠に「前の試合」をぶら下げて木にする。
// まだ決まっていない枠は No.39 のような番号で前の試合を指しているのでそれを辿り、
// 既に決まっている枠は前ラウンドで同じクラブが勝った試合を探して結ぶ
// （勝ち上がったクラブの名前に置き換わってしまい、番号が残らないため）。
function linkBracket(rounds) {
    const byNo = new Map();
    rounds.forEach((r, ri) => r.matches.forEach(m => {
        m.col = ri;
        if (m.no != null) byNo.set(m.no, m);
    }));

    rounds.forEach((r, ri) => {
        const winners = new Map();
        if (ri) rounds[ri - 1].matches.forEach(m => {
            const w = m.winner === 'home' ? m.home : m.winner === 'away' ? m.away : null;
            if (w) winners.set(w, m);
        });
        r.matches.forEach(m => {
            m.kidH = (m.srcH != null && byNo.get(m.srcH)) || winners.get(m.home) || null;
            m.kidA = (m.srcA != null && byNo.get(m.srcA)) || winners.get(m.away) || null;
        });
    });
}

// 木の縦位置を決める。葉（前の試合がない枠）を上から順に並べ、
// 親は子の中央に置く、という普通のトーナメント表の並べ方。
function bracketLayout(rounds) {
    linkBracket(rounds);

    const all      = rounds.flatMap(r => r.matches);
    const parented = new Set();
    all.forEach(m => brkKids(m).forEach(k => parented.add(k)));

    const y = new Map();
    let slot = 0;
    const walk = m => {
        if (y.has(m)) return;
        y.set(m, 0);                                    // 万一の循環参照でも止まらないように先に置く
        const ys = brkKids(m).map(k => { walk(k); return y.get(k); });
        y.set(m, ys.length ? (Math.min(...ys) + Math.max(...ys)) / 2 : slot++ * BRK_PITCH);
    };
    // 決勝側（列が右の根）から辿ると、葉が組み合わせ表どおりの順に上から並ぶ
    all.filter(m => !parented.has(m))
       .sort((a, b) => b.col - a.col || (a.no || 0) - (b.no || 0))
       .forEach(walk);
    all.forEach(walk);                                  // どこにも繋がらない試合も拾う

    // 左の列から順に、確定した子の中央へ寄せ直してから重なりをほどく
    rounds.forEach(r => {
        const list = r.matches.slice();
        list.forEach(m => {
            const ys = brkKids(m).map(k => y.get(k));
            if (ys.length) y.set(m, (Math.min(...ys) + Math.max(...ys)) / 2);
        });
        list.sort((a, b) => y.get(a) - y.get(b));
        list.forEach((m, i) => {
            if (i) y.set(m, Math.max(y.get(m), y.get(list[i - 1]) + BRK_PITCH));
        });
    });

    const top = Math.min(...all.map(m => y.get(m)));
    all.forEach(m => y.set(m, Math.round(y.get(m) - top)));
    return y;
}

function bracketHtml(rounds, key, year) {
    if (!rounds.length) return '<div class="error-box">日程を取得できませんでした</div>';

    const label  = key === 'levain' ? 'ルヴァンカップ' : '天皇杯';
    const source = key === 'levain'
        ? '出典: <a href="https://data.j-league.or.jp/SFMS01/" target="_blank" rel="noopener">Ｊリーグ データサイト</a>'
        : `出典: <a href="https://www.jfa.jp/match/emperorscup_${year}/schedule_result/" target="_blank" rel="noopener">JFA 天皇杯 日程・結果</a>`;

    // 柏の勝ち上がり。まだ組み合わせが決まっていないラウンドはここには出ない
    const steps = [];
    rounds.forEach(r => r.matches.forEach(m => {
        const home = isKashiwa(m.home), away = isKashiwa(m.away);
        if (!home && !away) return;

        const opp    = home ? m.away : m.home;
        const us     = home ? m.hs  : m.as;
        const them   = home ? m.as  : m.hs;
        const upk    = home ? m.hpk : m.apk;
        const tpk    = home ? m.apk : m.hpk;
        const played = us !== null && them !== null;
        const won    = m.winner === (home ? 'home' : 'away');

        const cls   = !played ? 'next' : won ? 'win' : 'loss';
        const score = !played ? (m.date || '日程未定')
            : `${won ? '○' : '●'} ${us}-${them}` + (upk !== null ? `（PK${upk}-${tpk}）` : '');

        steps.push(`
        <div class="brk-step ${cls}">
            <div class="brk-step-round">${r.round}</div>
            <div class="brk-step-opp">${opp}</div>
            <div class="brk-step-score">${score}</div>
        </div>`);
    }));

    const path = steps.length ? `
        <div class="section-label">柏レイソルの勝ち上がり</div>
        <div class="brk-path-wrap"><div class="brk-path">${steps.join('')}</div></div>` : '';

    // 組み合わせ表。左から右へ勝ち上がる形で、枠と枠を連結線で結ぶ
    const y      = bracketLayout(rounds);
    const all    = rounds.flatMap(r => r.matches);
    const colX   = c => c * (BRK_W + BRK_GAP);
    const width  = colX(rounds.length - 1) + BRK_W;
    const height = Math.max(...all.map(m => y.get(m))) + BRK_H;

    const heads = rounds.map(r => {
        const mine = r.matches.some(m => isKashiwa(m.home) || isKashiwa(m.away));
        // 「1stラウンド　２回戦」は列見出しには長いので、ラウンド名だけを出す
        const head = r.round.split('　').pop();
        return `<div class="brk-head${mine ? ' me' : ''}" style="width:${BRK_W}px">${head}</div>`;
    }).join('');

    const lines = [];
    all.forEach(m => brkKids(m).forEach(k => {
        const x1 = colX(k.col) + BRK_W, y1 = y.get(k) + BRK_H / 2;
        const x2 = colX(m.col),         y2 = y.get(m) + BRK_H / 2;
        const mid  = x1 + (x2 - x1) / 2;
        const mine = [k, m].some(t => isKashiwa(t.home) || isKashiwa(t.away));
        lines.push(`<path class="${mine ? 'me' : ''}" d="M${x1} ${y1}H${mid}V${y2}H${x2}"/>`);
    }));

    const boxes = all.map(m => bracketBox(m, colX(m.col), y.get(m))).join('');

    const bracket = `
        <div class="section-label">組み合わせ</div>
        <div class="brk-wrap">
            <div class="brk-scroll" style="width:${width}px">
                <div class="brk-heads" style="gap:${BRK_GAP}px">${heads}</div>
                <div class="brk-canvas" style="height:${height}px">
                    <svg class="brk-lines" width="${width}" height="${height}">${lines.join('')}</svg>
                    ${boxes}
                </div>
            </div>
        </div>
        <div class="brk-hint">縦横にスクロールできます</div>`;

    return `<div class="section-label">${label} トーナメント表</div>` + path + bracket
        + `<div class="comp-source">${source}</div>`;
}

function bracketBox(m, x, top) {
    const mine   = isKashiwa(m.home) || isKashiwa(m.away);
    const played = m.hs !== null && m.as !== null;

    const side = (name, sc, pk, key) => {
        const cls = isKashiwa(name) ? ' mine' : played && m.winner === key ? ' win' : '';
        const tbd = /^No\.\d+ 勝者$/.test(name) ? ' tbd' : '';
        const pks = played && pk !== null ? `<span class="brk-pkn">(${pk})</span>` : '';
        return `<div class="brk-side${cls}">
            <span class="brk-nm${tbd}">${name || '未定'}</span>
            <span class="brk-pt">${played ? sc : ''}${pks}</span>
        </div>`;
    };

    return `<div class="brk-box${mine ? ' me' : ''}"
                 style="left:${x}px;top:${top}px;width:${BRK_W}px;height:${BRK_H}px">
        <div class="brk-box-top">
            <span>${m.no != null ? 'No.' + m.no : ''}</span>
            <span>${m.date || '日程未定'}</span>
        </div>
        ${side(m.home, m.hs, m.hpk, 'home')}
        ${side(m.away, m.as, m.apk, 'away')}
    </div>`;
}

// 表は横にも縦にも広いので、柏が一番勝ち上がっている試合を中央に置いた状態で開く
function focusBracket() {
    const wrap = document.querySelector('#comp-body .brk-wrap');
    const mine = wrap && wrap.querySelectorAll('.brk-box.me');
    if (!mine || !mine.length) return;

    const box = mine[mine.length - 1];
    const w   = wrap.getBoundingClientRect();
    const b   = box.getBoundingClientRect();
    wrap.scrollLeft += b.left - w.left - (w.width  - b.width)  / 2;
    wrap.scrollTop  += b.top  - w.top  - (w.height - b.height) / 2;
}

// 順位表タブは大会をチップで切り替える。J1以外は選ばれたときに初めて取りに行く。
let compTab   = 'j1';
let compToken = 0;

async function showStandings(el) {
    const info = await getSeasonInfo();
    document.getElementById('season-title').textContent = info.label;
    updateHeaderStats(info);

    el.innerHTML = `
        <div class="comp-nav">${COMPETITIONS.map(c =>
            `<button class="comp-chip${c.key === compTab ? ' active' : ''}"
                     onclick="switchComp('${c.key}')">${c.label}</button>`).join('')}</div>
        <div id="comp-body"></div>`;
    renderComp();
}

function switchComp(key) {
    if (key === compTab) return;
    compTab = key;
    document.querySelectorAll('.comp-chip').forEach((btn, i) =>
        btn.classList.toggle('active', COMPETITIONS[i].key === key));
    renderComp();
}

async function renderComp() {
    const body = document.getElementById('comp-body');
    if (!body) return;

    if (compTab === 'j1') { body.innerHTML = await j1StandingsHtml(); return; }

    const key   = compTab;
    const token = ++compToken;
    body.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
        const [data, info] = await Promise.all([loadCompetition(key), getSeasonInfo()]);
        if (token !== compToken) return;   // 描画待ちの間に切り替えられていたら捨てる
        if (key === 'acl') {
            body.innerHTML = aclStandingsHtml(data);
        } else {
            body.innerHTML = bracketHtml(data, key, info.year);
            focusBracket();                // 柏の位置までスクロールしてから見せる
        }
    } catch (err) {
        delete compCache[key];             // 一時的な失敗をキャッシュしない
        if (token !== compToken) return;
        body.innerHTML = `<div class="error-box">${err.message || '取得できませんでした'}</div>`;
    }
}

function sv(stats, name) {
    const s = (stats || []).find(x => x.name === name);
    return s ? Math.round(s.value) : 0;
}

// J1（既に取得済みのシーズン情報から描く）。順位推移は見出しのボタンから開く
async function j1StandingsHtml() {
    const info = await getSeasonInfo();
    const data = info.standings;
    if (!data.children?.length && !data.standings) {
        return '<div class="error-box">順位表を取得できませんでした</div>';
    }
    const groups = data.children?.length
        ? data.children
        : [{ name: 'J1リーグ', standings: data.standings }];

    rankChartBuilt = false;   // タブを描き直すとグラフのDOMも消えるので組み立て直させる
    return `
        <div class="standings-head">
            <div class="section-label">${info.label}シーズン 順位表</div>
            <button class="rank-toggle" id="rank-toggle" onclick="toggleRankChart()">📈 順位推移</button>
        </div>
        <div id="rank-chart" hidden></div>` + standingsTable(groups, { top: 3, rel: 3 });
}

// ACLエリートのリーグステージ。柏のいる地区を先に出す
const ACL_GROUP_JP = { East: '東地区', West: '西地区' };

function aclStandingsHtml(data) {
    const groups = (data.children || []).slice();
    if (!groups.length) return '<div class="error-box">ACLの順位表を取得できませんでした</div>';

    const hasUs = g => (g.standings?.entries || []).some(e => e.team?.id === TEAM_ID) ? 1 : 0;
    groups.sort((a, b) => hasUs(b) - hasUs(a));

    return '<div class="section-label">ACLエリート リーグステージ</div>'
        + standingsTable(groups.map(g => ({ ...g, name: ACL_GROUP_JP[g.name] || g.name })),
                         { top: 8, rel: 0 })
        + '<div class="comp-source">各地区の上位8クラブがラウンド16に進出　出典: ESPN</div>';
}

// J1・ACLで共通の順位表。top位までを強調、下位rel位を降格圏として色を変える
function standingsTable(groups, opts) {
    const top = opts.top, rel = opts.rel;

    return groups.map(group => {
        const entries = (group.standings?.entries || [])
            .slice()
            .sort((a, b) => sv(a.stats, 'rank') - sv(b.stats, 'rank'));
        const total = entries.length;

        const rows = entries.map(entry => {
            const team  = entry.team || {};
            const stats = entry.stats || [];
            const rank  = sv(stats, 'rank');
            const pts   = sv(stats, 'points');
            const gp    = sv(stats, 'gamesPlayed');
            const w     = sv(stats, 'wins');
            const d     = sv(stats, 'ties');
            const l     = sv(stats, 'losses');
            const gf    = sv(stats, 'pointsFor');
            const ga    = sv(stats, 'pointsAgainst');
            const gd    = gf - ga;
            const isMe  = team.id === TEAM_ID;
            const logo  = getLogo(team) || LOGO(team.id);
            const name  = toJP(team.displayName || '');

            const rankCls = rank <= top ? 'rank-top'
                          : rel && rank > total - rel ? 'rank-rel' : '';
            const gdStr   = gd > 0 ? '+' + gd : String(gd);

            return `
            <tr class="${isMe ? 'me' : ''}">
                <td class="td-rank ${rankCls}">${rank}</td>
                <td class="td-team">
                    <div class="td-team-inner">
                        <img src="${logo}" alt="" onerror="this.style.display='none'">
                        <span class="td-team-name">${name}</span>
                    </div>
                </td>
                <td>${gp}</td>
                <td>${w}</td>
                <td>${d}</td>
                <td>${l}</td>
                <td>${gf}</td>
                <td>${ga}</td>
                <td>${gdStr}</td>
                <td class="td-pts">${pts}</td>
            </tr>`;
        }).join('');

        const label = group.name && groups.length > 1
            ? `<div class="standings-group-label">${group.name}</div>` : '';

        return label + `
        <table class="standings-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th class="th-team">クラブ</th>
                    <th>試</th><th>勝</th><th>分</th><th>負</th>
                    <th>得</th><th>失</th><th>差</th>
                    <th>勝点</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>`;
    }).join('');
}

// ヘッダーの成績はJ1のものを出す（他大会に切り替えても書き換えない）
function updateHeaderStats(info) {
    const data   = info.standings || {};
    const groups = data.children?.length ? data.children : [{ standings: data.standings }];
    const me = groups.flatMap(g => g.standings?.entries || []).find(e => e.team?.id === TEAM_ID);
    if (!me) return;

    const s    = me.stats || [];
    const rank = sv(s, 'rank');
    const pts  = sv(s, 'points');
    const w    = sv(s, 'wins');
    const d    = sv(s, 'ties');
    const l    = sv(s, 'losses');
    document.getElementById('header-stats').innerHTML = `
        <div class="hstat"><span class="hstat-val">${rank}位</span><span class="hstat-lbl">順位</span></div>
        <div class="hstat-divider"></div>
        <div class="hstat"><span class="hstat-val">${pts}pt</span><span class="hstat-lbl">勝点</span></div>
        <div class="hstat-divider"></div>
        <div class="hstat"><span class="hstat-val">${w}勝${d}分${l}敗</span><span class="hstat-lbl">戦績</span></div>`;
}

loaded['standings'] = true;
load('standings');
