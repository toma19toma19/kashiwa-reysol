<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>柏レイソル</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif;
            background: #0e0f13;
            color: #fff;
            min-height: 100vh;
        }

        /* ── ヘッダー ── */
        header {
            background: linear-gradient(180deg, #1c1700 0%, #0e0f13 100%);
            padding: 24px 24px 20px;
            border-bottom: 1px solid #1e2030;
            position: relative;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700 30%, #FFD700 70%, transparent);
        }
        .header-inner {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .team-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 16px rgba(255,215,0,0.35));
        }
        .header-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .header-info .team-name {
            font-size: 0.72rem;
            font-weight: 600;
            color: #777;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .header-stats {
            display: flex;
            align-items: center;
            gap: 0;
            flex-wrap: wrap;
        }
        .hstat {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0 16px 0 0;
        }
        .hstat:first-child { padding-left: 0; }
        .hstat-val {
            font-size: 1.5rem;
            font-weight: 800;
            color: #FFD700;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        .hstat-lbl {
            font-size: 0.62rem;
            color: #777;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .hstat-divider {
            width: 1px;
            height: 32px;
            background: #252830;
            margin: 0 16px 0 0;
            flex-shrink: 0;
        }

        /* ── タブ ── */
        .tabs {
            display: flex;
            background: #0e0f13;
            border-bottom: 1px solid #1e2030;
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 0 8px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 8px;
            cursor: pointer;
            color: #777;
            font-size: 0.85rem;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: color 0.2s;
            user-select: none;
            letter-spacing: 0.02em;
        }
        .tab:hover { color: #aaa; }
        .tab.active { color: #FFD700; border-bottom-color: #FFD700; }

        /* ── コンテンツ ── */
        .content {
            max-width: 680px;
            margin: 0 auto;
            padding: 16px 12px 60px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #666;
            text-transform: uppercase;
            margin: 20px 4px 10px;
        }

        /* ── 試合カード ── */
        .match-card {
            background: #161820;
            border-radius: 12px;
            margin-bottom: 8px;
            overflow: hidden;
            border-left: 3px solid #2a2d3a;
            transition: border-color 0.2s;
        }
        .match-card.win  { border-left-color: #2ecc71; }
        .match-card.loss { border-left-color: #e74c3c; }
        .match-card.draw { border-left-color: #555; }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #12131a;
            font-size: 0.7rem;
            color: #777;
            letter-spacing: 0.04em;
        }
        .card-top .league { color: #888; }
        .card-top .venue  { color: #666; }

        .card-body {
            display: flex;
            align-items: center;
            padding: 14px 14px;
            gap: 6px;
        }
        .card-team {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-team.right {
            flex-direction: row-reverse;
            text-align: right;
        }
        .card-team img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .card-team-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #bbb;
            line-height: 1.3;
        }
        .card-team-name.us { color: #fff; }

        .card-score {
            text-align: center;
            min-width: 88px;
            flex-shrink: 0;
        }
        .score-num {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .result-pill {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 5px;
            letter-spacing: 0.04em;
        }
        .result-pill.win  { background: #0d3320; color: #2ecc71; }
        .result-pill.loss { background: #330d0d; color: #e74c3c; }
        .result-pill.draw { background: #252525; color: #777; }
        .result-pill.live { background: #3a1111; color: #ff5a5a; }
        .result-pill.upcoming { background: #2a2618; color: #FFD700; }

        /* ── 試合結果（1試合ずつ横送り） ── */
        .mw-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #12131a;
            border: 1px solid #1e2030;
            border-radius: 12px;
            padding: 6px 8px;
            margin-bottom: 10px;
            position: sticky;
            top: 51px;
            z-index: 9;
        }
        .mw-btn {
            background: #1c1e28;
            border: none;
            color: #ccc;
            font-size: 0.95rem;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .mw-btn:hover:not(:disabled) { background: #262936; color: #FFD700; }
        .mw-btn:disabled { opacity: 0.25; cursor: default; }
        .mw-label { flex: 1; text-align: center; line-height: 1.25; min-width: 0; }
        .mw-round {
            font-size: 0.9rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.03em;
        }
        .mw-date {
            font-size: 0.68rem;
            font-weight: 600;
            color: #7a7f90;
            margin-top: 2px;
        }
        .mw-back {
            display: block;
            width: 100%;
            background: #1a1c26;
            border: 1px solid #262a38;
            color: #FFD700;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 8px;
            border-radius: 9px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .mw-back:hover { background: #22242f; }

        .mw-view { overflow: hidden; }
        @keyframes mwFromRight { from { opacity: 0; transform: translateX(30px); }  to { opacity: 1; transform: none; } }
        @keyframes mwFromLeft  { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
        .mw-slide.in-right { animation: mwFromRight 0.22s ease-out; }
        .mw-slide.in-left  { animation: mwFromLeft  0.22s ease-out; }

        .match-card.upcoming { border-left-color: #FFD700; }
        .mw-hero { margin-bottom: 4px; }
        .mw-hero.clickable { cursor: pointer; }
        .mw-hero-body {
            display: flex;
            align-items: center;
            padding: 18px 14px 16px;
            gap: 6px;
        }
        .mw-hero .card-team img { width: 46px; height: 46px; }
        .mw-hero .card-team-name { font-size: 0.9rem; }
        .mw-hero-center { text-align: center; min-width: 104px; flex-shrink: 0; }
        .mw-score {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
            color: #fff;
        }
        .mw-score-sep { color: #555; margin: 0 8px; font-weight: 600; }
        .mw-vs { font-size: 1.3rem; font-weight: 800; color: #4a4f60; line-height: 1; }
        .mw-ko { font-size: 0.8rem; font-weight: 700; color: #ccc; margin-top: 6px; }
        .mw-hero-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 9px 14px;
            background: #12131a;
            border-top: 1px solid #1e2030;
            font-size: 0.68rem;
            color: #7a7f90;
        }
        .mw-more { color: #FFD700; font-weight: 700; flex-shrink: 0; }

        /* ── 節ごとの試合一覧 ── */
        .round-date {
            font-size: 0.7rem;
            font-weight: 700;
            color: #666;
            letter-spacing: 0.06em;
            margin: 14px 4px 8px;
        }
        .fixture {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #161820;
            border-radius: 10px;
            border-left: 3px solid #2a2d3a;
            padding: 11px 12px;
            margin-bottom: 6px;
        }
        .fixture.mine { border-left-color: #FFD700; background: #191b24; }
        .fixture-team {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .fixture-team.right { flex-direction: row-reverse; text-align: right; }
        .fixture-team img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .fixture-name {
            font-size: 0.78rem;
            font-weight: 600;
            color: #999;
            line-height: 1.25;
        }
        .fixture-name.mine   { color: #FFD700; }
        .fixture-name.winner { color: #fff; }
        .fixture-score {
            min-width: 62px;
            text-align: center;
            flex-shrink: 0;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #eee;
        }
        .fixture-time {
            min-width: 62px;
            text-align: center;
            flex-shrink: 0;
            font-size: 0.75rem;
            font-weight: 700;
            color: #666;
        }
        .fixture-live { color: #e74c3c; }

        /* ── フォーム ── */
        .form-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #222;
        }
        .form-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 10px;
        }
        .form-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .form-pill {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }
        .form-pill.w { background: #0d3320; color: #2ecc71; }
        .form-pill.d { background: #252525; color: #888; }
        .form-pill.l { background: #330d0d; color: #e74c3c; }
        .form-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .form-date {
            font-size: 0.62rem;
            font-weight: 700;
            color: #9aa0b0;
            line-height: 1;
            letter-spacing: 0.01em;
        }
        .form-year {
            font-size: 0.55rem;
            font-weight: 600;
            color: #5f6474;
            line-height: 1;
            margin-top: -1px;
        }
        .form-note {
            font-size: 0.6rem;
            font-weight: 600;
            color: #555;
            letter-spacing: 0.04em;
            text-transform: none;
            margin-left: 8px;
        }
        /* ── 両チームフォーム ── */
        .form-both-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .form-both-row:last-child { margin-bottom: 0; }
        .form-team-label {
            font-size: 0.72rem;
            color: #888;
            width: 56px;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .form-team-label.us { color: #FFD700; font-weight: 700; }

        /* ── H2H ── */
        .h2h-container {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .h2h-matches { flex: 1; }
        .h2h-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .h2h-row:last-child { border-bottom: none; }
        .h2h-label { font-size: 0.68rem; color: #777; width: 44px; flex-shrink: 0; }
        .h2h-date  { font-size: 0.7rem;  color: #777; width: 52px; flex-shrink: 0; }
        .h2h-ha    { font-size: 0.65rem; color: #666; background: #1e2030; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
        .h2h-pill {
            width: 24px; height: 24px;
            border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.68rem; font-weight: 800;
            flex-shrink: 0;
        }
        .h2h-pill.w { background: #0d3320; color: #2ecc71; }
        .h2h-pill.d { background: #252525; color: #888; }
        .h2h-pill.l { background: #330d0d; color: #e74c3c; }
        .h2h-score { font-size: 0.82rem; font-weight: 700; color: #ddd; }
        .h2h-overall {
            flex-shrink: 0;
            background: #12131a;
            border-radius: 8px;
            padding: 10px 12px;
            text-align: center;
            min-width: 64px;
        }
        .h2h-overall-title {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .h2h-stat {
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 4px;
        }
        .h2h-stat.w { color: #2ecc71; }
        .h2h-stat.d { color: #888; }
        .h2h-stat.l { color: #e74c3c; }
        .h2h-stat span { font-size: 0.65rem; font-weight: 600; color: #666; margin-left: 2px; }

        .mw-preview-loading { padding: 26px 0 6px; text-align: center; }
        .mw-preview-loading .spinner { margin: 0 auto; }

        /* ── 試合カード タップ ── */
        .match-card { cursor: pointer; }
        .match-card:hover { background: #1a1c28; }
        .match-card:active { opacity: 0.8; }

        /* ── 試合詳細モーダル ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 680px;
            margin: 0 auto;
            background: #161820;
            border-radius: 20px 20px 0 0;
            max-height: 94vh;
            overflow-y: auto;
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
        }
        .modal-sheet.open { transform: translateY(0); }
        .modal-handle {
            width: 40px; height: 4px;
            background: #2a2d3a;
            border-radius: 2px;
            margin: 12px auto 0;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 16px 0;
            gap: 8px;
        }
        .modal-meta { font-size: 0.7rem; color: #777; line-height: 1.6; flex: 1; }
        .modal-close {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: #252830;
            border: none;
            color: #888;
            font-size: 0.85rem;
            cursor: pointer;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-scoreboard {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 16px 16px;
            gap: 8px;
        }
        .modal-team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }
        .modal-team img { width: 50px; height: 50px; object-fit: contain; }
        .modal-team-name { font-size: 0.82rem; font-weight: 700; color: #fff; line-height: 1.3; }
        .modal-score-wrap { text-align: center; flex-shrink: 0; }
        .modal-score-num {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            line-height: 1;
        }
        .modal-section {
            padding: 14px 16px;
            border-top: 1px solid #1e2030;
        }
        .modal-section-title {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
        }
        .event-min  { font-size: 0.72rem; color: #FFD700; font-weight: 700; width: 30px; flex-shrink: 0; }
        .event-icon { font-size: 0.9rem; flex-shrink: 0; }
        .event-name { font-size: 0.85rem; color: #ccc; flex: 1; }
        .event-side { font-size: 0.68rem; color: #777; flex-shrink: 0; }
        .stat-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 0;
            border-bottom: 1px solid #1a1c24;
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-val { width: 38px; font-size: 0.82rem; font-weight: 700; color: #888; }
        .stat-val.left  { text-align: right; }
        .stat-val.right { text-align: left; }
        .stat-val.us { color: #FFD700; }
        .stat-center { flex: 1; text-align: center; }
        .stat-name { font-size: 0.68rem; color: #777; display: block; margin-bottom: 5px; }
        .stat-bars { display: flex; height: 4px; border-radius: 2px; overflow: hidden; gap: 2px; }
        .stat-bar-l { background: #FFD700; border-radius: 2px; min-width: 2px; }
        .stat-bar-r { background: #3a4060; border-radius: 2px; min-width: 2px; }
        /* 前半・後半スコア */
        .half-scores {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            padding: 10px 16px 16px;
            border-top: 1px solid #1e2030;
        }
        .half-score-block { text-align: center; padding: 0 20px; }
        .half-score-label {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 4px;
        }
        .half-score-num { font-size: 1.05rem; font-weight: 700; color: #aaa; }
        .half-score-sep { color: #252830; font-size: 1.2rem; }
        /* シンプルスタッツ行（ポゼッション以外） */
        .stat-simple-row {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #1a1c24;
        }
        .stat-simple-row:last-child { border-bottom: none; }
        .stat-num {
            width: 44px;
            font-size: 1rem;
            font-weight: 800;
            color: #ddd;
        }
        .stat-num.left  { text-align: right; color: #FFD700; }
        .stat-num.right { text-align: left;  color: #888; }
        .stat-lbl-center {
            flex: 1;
            text-align: center;
            font-size: 0.72rem;
            color: #777;
        }
        /* 得点チームの色 */
        .event-side.us { color: #FFD700; font-weight: 600; }

        /* ── ローディング / エラー ── */
        .loading {
            text-align: center;
            color: #666;
            padding: 70px 20px;
        }
        .spinner {
            width: 30px; height: 30px;
            border: 3px solid #1e2030;
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { font-size: 0.85rem; letter-spacing: 0.04em; }

        .error-box {
            background: #180e0e;
            border: 1px solid #3a1a1a;
            border-radius: 10px;
            padding: 16px;
            color: #bb5555;
            font-size: 0.85rem;
            line-height: 1.8;
        }

        /* ── 順位表 ── */
        .standings-group-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #666;
            text-transform: uppercase;
            margin: 20px 4px 8px;
        }
        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        .standings-table thead th {
            padding: 8px 6px;
            color: #666;
            font-size: 0.68rem;
            font-weight: 700;

// ---- シーズン情報 ----
// ESPNは 2026-07-01 から秋春制（2026-27）を seasontype=4 で提供している。
// パラメータを付けずに順位表APIを叩くと「現在進行中のシーズン/タイプ」が返るので、
// 年やタイプをハードコードせずここから取得する。
const STANDINGS_URL = 'https://site.web.api.espn.com/apis/v2/sports/soccer/jpn.1/standings';
let seasonInfoCache = null;

async function getSeasonInfo() {
    if (seasonInfoCache) return seasonInfoCache;
    let data = {};
    try {
        const res = await fetch(STANDINGS_URL + '?type=0');
        if (res.ok) data = await res.json();
    } catch(e) { /* 取得失敗時は下のフォールバックへ */ }

    const st   = data.children?.[0]?.standings || data.standings || {};
    const year = st.season     || data.season || new Date().getFullYear();
    const type = st.seasonType || 1;

    // seasons[].types[] から現行シーズンの開始日を引く
    let start = null;
    const t = (data.seasons || []).find(s => s.year === year)
                                  ?.types?.find(x => String(x.id) === String(type));
    if (t?.startDate) start = new Date(t.startDate);

    // 7月以降に開幕するシーズンは年跨ぎ（例: 2026-27）
    const label = start && start.getUTCMonth() >= 6
        ? `${year}-${String(year + 1).slice(2)}`
        : String(year);

    // 参加クラブ数（節あたりの試合数の算出に使う）
    const teamCount = (data.children || []).reduce((n, c) => n + (c.standings?.entries?.length || 0), 0)
                      || (data.standings?.entries?.length || 0);

    seasonInfoCache = { year, type, start, label, teamCount, standings: data };
    return seasonInfoCache;
}

// ---- スケジュール取得 ----
// 現行シーズンを明示指定したものと、ESPNの既定（移行前シーズンを返すことがある）を
// マージして保持する。直近フォームなど過去の試合が必要な箇所でも欠落しないようにするため。
function mergeEvents(...lists) {
    const map = new Map();
    lists.filter(Boolean).flat().forEach(ev => { if (ev?.id) map.set(ev.id, ev); });
    return [...map.values()].sort((a, b) => new Date(a.date) - new Date(b.date));
}

// スコアボードのイベントはスコアが文字列なので、スケジュールAPIと同じ形に揃える
function normaliseScoreboardEvent(ev) {
    const comp = ev.competitions?.[0];
    if (!comp) return ev;
    return { ...ev, competitions: [{ ...comp,
        competitors: (comp.competitors || []).map(c => ({
            ...c,
            score: (c.score && typeof c.score === 'object') ? c.score : { value: Number(c.score) },
        })),
    }] };
}

// チーム別スケジュールAPIはシーズン移行直後などデータ登録が遅れることがあるため、
// リーグ全体のスコアボード（開幕日から1年分）を予備の取得元として持っておく
let scoreboardCache = null;
async function getLeagueScoreboard(start) {
    if (scoreboardCache) return scoreboardCache;
    const from = start || new Date();
    const to   = new Date(from.getTime() + 364 * 86400000); // 366日以上の範囲はESPNが400を返す
    const ymd  = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    const res  = await fetch(`${BASE}/scoreboard?dates=${ymd(from)}-${ymd(to)}&limit=1000`);
    if (!res.ok) return [];   // 一時的な失敗をキャッシュしない
    const data = await res.json();
    scoreboardCache = (data.events || []).map(normaliseScoreboardEvent);
    return scoreboardCache;
}

async function fetchTeamSchedule(teamId) {
    const info = await getSeasonInfo();
    const path = '/teams/' + teamId + '/schedule';
    const [cur, def] = await Promise.all([
        get(`${path}?season=${info.year}&seasontype=${info.type}`).catch(() => null),
        get(path).catch(() => null),
    ]);
    let events = mergeEvents(cur?.events, def?.events);

    // 現行シーズンの試合が1件も取れていなければスコアボードから補う
    if (!events.some(ev => isCurrentSeason(ev, info))) {
        const sb = await getLeagueScoreboard(info.start).catch(() => []);
        events = mergeEvents(events, sb.filter(ev =>
            ev.competitions?.[0]?.competitors?.some(c => c.team?.id === teamId)));
    }
    return events;
}

// 全試合（過去シーズンを含む）
let scheduleCache = null;
async function getSchedule() {
    if (!scheduleCache) scheduleCache = await fetchTeamSchedule(TEAM_ID);
    return scheduleCache;
}

// 現行シーズンの試合のみ
function isCurrentSeason(ev, info) {
    if (ev.season?.year === info.year && String(ev.seasonType?.id) === String(info.type)) return true;
    if (info.start && new Date(ev.date) >= info.start) return true;
    return false;
}

async function getSeasonSchedule() {
    const [events, info] = await Promise.all([getSchedule(), getSeasonInfo()]);
    return events.filter(ev => isCurrentSeason(ev, info));
}

// ---- イベント解析 ----

// キックオフ時刻が未定の試合にESPNは 18:00Z などのプレースホルダを入れる。
// そのままJSTへ変換すると日付が翌日にずれるため、未定時は日付だけを採用する。
function eventDateInfo(ev) {
    const timeValid = ev.competitions?.[0]?.timeValid !== false;
    if (timeValid) return { date: new Date(ev.date), timeValid: true };
    const [y, m, d] = String(ev.date).slice(0, 10).split('-').map(Number);
    return { date: new Date(y, m - 1, d), timeValid: false };
}

function parseEvent(ev) {
    const comp = ev.competitions?.[0];
    if (!comp) return null;
    const home = comp.competitors.find(c => c.homeAway === 'home');
    const away = comp.competitors.find(c => c.homeAway === 'away');
    const isHome  = home?.team?.id === TEAM_ID;
    const us      = isHome ? home : away;
    const them    = isHome ? away : home;
    const sName   = comp.status?.type?.name || '';
    const done    = sName === 'STATUS_FULL_TIME' || sName === 'STATUS_FINAL' || sName.startsWith('STATUS_FINAL');
    const when    = eventDateInfo(ev);
    return {
        id:       ev.id || '',
        date:     when.date,
        timeValid: when.timeValid,
        league:   leagueJP(ev.season?.displayName),
        venue:    venueJP(comp.venue?.fullName || ''),
        isHome,
        ourTeam:  toJP(us?.team?.displayName   || '柏レイソル'),
        oppTeam:  toJP(them?.team?.displayName  || ''),
        ourLogo:  getLogo(us?.team)   || LOGO(TEAM_ID),
        oppLogo:  getLogo(them?.team) || LOGO(them?.team?.id),
        oppId:    them?.team?.id   || '',
        ourScore: done && us?.score?.value   != null ? Math.round(us.score.value)   : null,
        oppScore: done && them?.score?.value != null ? Math.round(them.score.value) : null,
        completed: done,
    };
}

// ---- 天気 ----
function wmoToText(code) {
    if (code === 0)                 return { emoji: '☀️',  text: '晴れ' };
    if (code === 1)                 return { emoji: '🌤️', text: '概ね晴れ' };
    if (code === 2)                 return { emoji: '⛅',  text: '一部曇り' };
    if (code === 3)                 return { emoji: '☁️',  text: '曇り' };
    if (code === 45 || code === 48) return { emoji: '🌫️', text: '霧' };
    if (code >= 51 && code <= 57)   return { emoji: '🌦️', text: '霧雨' };
    if (code >= 61 && code <= 67)   return { emoji: '🌧️', text: '雨' };
    if (code >= 71 && code <= 77)   return { emoji: '❄️',  text: '雪' };
    if (code >= 80 && code <= 82)   return { emoji: '🌦️', text: 'にわか雨' };
    if (code === 85 || code === 86) return { emoji: '🌨️', text: 'にわか雪' };
    if (code >= 95)                 return { emoji: '⛈️',  text: '雷雨' };
    return { emoji: '🌡️', text: '不明' };
}

async function fetchWeather(venue, kickoffDate) {
    const coords = STADIUM_COORDS[venue];
    if (!coords) return null;
    const { lat, lon } = coords;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&hourly=weather_code,precipitation_probability,temperature_2m&timezone=Asia%2FTokyo&forecast_days=16`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const times = data.hourly?.time || [];
    const codes = data.hourly?.weather_code || [];
    const probs = data.hourly?.precipitation_probability || [];
    const temps = data.hourly?.temperature_2m || [];
    // キックオフ-2h 〜 キックオフ+3h（試合終了後1h相当）
    const slots = [];
    for (let offset = -2; offset <= 3; offset++) {
        const t  = new Date(kickoffDate.getTime() + offset * 3600 * 1000);
        const y  = t.getFullYear();
        const mo = String(t.getMonth() + 1).padStart(2, '0');
        const d  = String(t.getDate()).padStart(2, '0');
        const h  = String(t.getHours()).padStart(2, '0');
        const key = `${y}-${mo}-${d}T${h}:00`;
        const idx = times.indexOf(key);
        if (idx >= 0) slots.push({ offset, time: t, code: codes[idx], prob: probs[idx] ?? 0, temp: temps[idx] ?? null });
    }
    return slots.length >= 3 ? slots : null;
}

function buildWeather(slots, venue) {
    if (!slots || !slots.length) return '';
    const items = slots.map(s => {
        const { emoji } = wmoToText(s.code);
        const isKO    = s.offset === 0;
        const timeStr = s.time.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        const probCls = s.prob >= 70 ? 'high' : s.prob >= 40 ? 'mid' : '';
        return `
        <div class="weather-slot${isKO ? ' kickoff' : ''}">
            <div class="weather-time">${timeStr}</div>
            ${isKO ? '<div class="weather-ko">KO</div>' : '<div class="weather-ko-spacer"></div>'}
            <div class="weather-emoji">${emoji}</div>
            <div class="weather-temp">${s.temp !== null ? Math.round(s.temp) + '°' : '—'}</div>
            <div class="weather-prob ${probCls}">${s.prob}%</div>
        </div>`;
    }).join('');
    return `
    <div class="weather-section">
        <div class="form-label">スタジアム天気予報</div>
        <div class="weather-row">${items}</div>
    </div>`;
}

// ---- 試合結果 ----
// 柏の試合を1件だけ大きく表示し、その下に同じ節の他会場の試合を並べる。
// 初期表示は直前（最後に終了した）試合。◀▶ ボタンとスワイプで過去／先の試合へ移動する。
let resultEventsMap = {};   // eventId → parseEvent の結果（詳細モーダル用）
let mwList   = [];          // [{ ev, e, round, others }] 日付昇順
let mwIndex  = 0;
let mwLatest = 0;           // 初期表示位置（直近の試合）

async function showResults(el) {
    const [events, info] = await Promise.all([getSeasonSchedule(), getSeasonInfo()]);

    // 同じ節の他会場を出すため、リーグ全体の日程から節を組み立てておく
    const league = (await getLeagueScoreboard(info.start).catch(() => []))
                       .filter(ev => isCurrentSeason(ev, info));
    const rounds = buildRounds(league, Math.floor(info.teamCount / 2));

    const roundById = new Map();
    rounds.forEach((r, i) => r.forEach(ev => roundById.set(String(ev.id), i)));

    // チーム日程とスコアボードでIDが噛み合わないことがあるので、近い日付の柏の試合からも節を引く
    const roundOf = (ev, date) => {
        const byId = roundById.get(String(ev.id));
        if (byId !== undefined) return byId;
        const i = rounds.findIndex(r => r.some(o =>
            (o.competitions?.[0]?.competitors || []).some(c => c.team?.id === TEAM_ID) &&
            Math.abs(new Date(o.date) - date) < 3 * 86400000));
        return i < 0 ? null : i;
    };

    // チーム日程APIはシーズン移行直後だと数試合しか返さないため、
    // スコアボード側の柏の試合とマージして年間の全試合を確保する（重複はチーム日程を優先）
    const mine = league.filter(ev =>
        (ev.competitions?.[0]?.competitors || []).some(c => c.team?.id === TEAM_ID));

    resultEventsMap = {};
    mwList = mergeEvents(mine, events)
        .map(ev => ({ ev, e: parseEvent(ev) }))
        .filter(x => x.e)
        .sort((a, b) => a.e.date - b.e.date)
        .map(x => {
            // 開催中の試合は parseEvent がスコアを返さないので、その場で補う
            x.e.live = eventStatus(x.ev).live;
            if (x.e.live && x.e.ourScore === null) {
                const list = x.ev.competitions?.[0]?.competitors || [];
                const num  = c => (c?.score?.value != null ? Math.round(c.score.value) : null);
                x.e.ourScore = num(list.find(c => c.team?.id === TEAM_ID));
                x.e.oppScore = num(list.find(c => c.team?.id !== TEAM_ID));
            }
            resultEventsMap[x.e.id] = x.e;
            const round  = roundOf(x.ev, x.e.date);
            const others = round === null ? []
                : rounds[round].filter(o => String(o.id) !== String(x.ev.id));
            return { ...x, round, others };
        });

    if (!mwList.length) {
        el.innerHTML = `<div class="section-label">${info.label}シーズン 試合結果</div>` +
            '<div class="error-box">今シーズンの試合情報を取得できませんでした</div>';
        return;
    }

    // 最後に終了した（または開催中の）試合＝直前の試合。1試合も終わっていなければ開幕戦
    mwLatest = 0;
    mwList.forEach((m, i) => { if (m.e.completed || eventStatus(m.ev).live) mwLatest = i; });
    mwIndex  = mwLatest;
    renderMatchweek();
}

function moveMatchweek(diff) {
    const next = mwIndex + diff;
    if (next < 0 || next >= mwList.length) return;
    mwIndex = next;
    renderMatchweek(diff > 0 ? 'right' : 'left');
    window.scrollTo({ top: 0, behavior: 'instant' });
}

function jumpMatchweek(i) {
    if (i < 0 || i >= mwList.length || i === mwIndex) return;
    const dir = i > mwIndex ? 'right' : 'left';
    mwIndex = i;
    renderMatchweek(dir);
    window.scrollTo({ top: 0, behavior: 'instant' });
}

// 横スワイプでも前後の試合へ移動できるようにする
let mwTouchX = 0, mwTouchY = 0;
function mwTouchStart(ev) {
    const t = ev.changedTouches[0];
    mwTouchX = t.clientX;
    mwTouchY = t.clientY;
}
function mwTouchEnd(ev) {
    const t  = ev.changedTouches[0];
    const dx = t.clientX - mwTouchX;
    const dy = t.clientY - mwTouchY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) moveMatchweek(dx < 0 ? 1 : -1);
}

function renderMatchweek(dir) {
    const el = document.getElementById('tab-results');
    const m  = mwList[mwIndex];
    if (!el || !m) return;

    const roundLabel = m.round === null ? m.e.league : `第${m.round + 1}節`;
    const dateStr    = m.e.date.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', weekday: 'short' });

    const nav = `
    <div class="mw-nav">
        <button class="mw-btn" onclick="moveMatchweek(-1)" ${mwIndex === 0 ? 'disabled' : ''} title="前の試合">◀</button>
        <div class="mw-label">
            <div class="mw-round">${roundLabel}</div>
            <div class="mw-date">${dateStr}　${mwIndex + 1} / ${mwList.length}</div>
        </div>
        <button class="mw-btn" onclick="moveMatchweek(1)" ${mwIndex === mwList.length - 1 ? 'disabled' : ''} title="次の試合">▶</button>
    </div>`;

    const back = mwIndex === mwLatest ? ''
        : `<button class="mw-back" onclick="jumpMatchweek(${mwLatest})">直近の試合へ戻る</button>`;

    // これから行われる試合は、天気・対戦成績・直近フォームを後追いで差し込む
    const upcoming = !m.e.completed && !m.e.live;
    const preview  = upcoming
        ? `<div id="mw-preview">${mwPreviewCache[m.e.id] ?? '<div class="mw-preview-loading"><div class="spinner"></div></div>'}</div>`
        : '';

    el.innerHTML = nav + back + `
    <div class="mw-view" ontouchstart="mwTouchStart(event)" ontouchend="mwTouchEnd(event)">
        <div class="mw-slide${dir ? ' in-' + dir : ''}">${heroCard(m)}${preview}${otherFixtures(m)}</div>
    </div>`;

    if (upcoming && mwPreviewCache[m.e.id] === undefined) fillPreview(m, ++mwToken);
}

// 予定試合のプレビュー（旧「次の試合」タブの内容）
let mwPreviewCache = {};   // eventId → HTML
let mwToken = 0;           // 連打で古い取得結果が描画されるのを防ぐ

async function fillPreview(m, token) {
    const e = m.e;
    let html = '';
    try {
        const info = await getSeasonInfo();
        const [oppEvents, weatherSlots, ourAll] = await Promise.all([
            e.oppId ? fetchTeamSchedule(e.oppId).catch(() => null) : Promise.resolve(null),
            // キックオフ時刻が未定、または予報範囲(16日)より先の試合は天気を出さない
            e.venue && e.timeValid ? fetchWeather(e.venue, e.date).catch(() => null) : Promise.resolve(null),
            getSchedule().catch(() => []),
        ]);

        // 直近フォームは過去シーズンも含め、今季対戦成績は現行シーズンのみを使う
        const past = mergeEvents(ourAll, mwList.map(x => x.ev))
            .map(parseEvent).filter(p => p && p.completed && p.date < e.date);
        const h2h  = past.filter(p => p.oppId === e.oppId && p.date >= (info.start || 0));

        let oppResults = [];
        if (oppEvents) {
            const sb = scoreboardCache || [];
            oppResults = mergeEvents(oppEvents, sb.filter(ev =>
                    (ev.competitions?.[0]?.competitors || []).some(c => c.team?.id === e.oppId)))
                .filter(ev => eventDateInfo(ev).date < e.date)
                .map(ev => resultForTeam(ev, e.oppId))
                .filter(Boolean)
                .slice(-5);
        }

        html = buildWeather(weatherSlots, e.venue)
             + buildH2H(h2h, e.oppTeam)
             + buildFormBoth(past.slice(-5), oppResults, e.ourTeam, e.oppTeam);
    } catch (err) {
        html = '';
    }

    mwPreviewCache[e.id] = html;
    if (token !== mwToken) return;   // 表示中の試合が変わっていれば描画しない
    const slot = document.getElementById('mw-preview');
    if (slot) slot.innerHTML = html;
}

// 柏の試合カード（終了ならスコアとタップで詳細、未消化ならキックオフ時刻）
function heroCard(m) {
    const e    = m.e;
    const live = e.live;
    const us   = e.ourScore, them = e.oppScore;
    const hasScore = us !== null && them !== null;

    const cls     = !hasScore ? 'upcoming' : us > them ? 'win' : us < them ? 'loss' : 'draw';
    const pillCls = live ? 'live' : cls;
    const label   = live ? 'LIVE'
                  : !hasScore ? (e.isHome ? 'HOME' : 'AWAY')
                  : us > them ? 'WIN' : us < them ? 'LOSE' : 'DRAW';

    const [left, right]         = e.isHome ? [e.ourTeam, e.oppTeam] : [e.oppTeam, e.ourTeam];
    const [leftLogo, rightLogo] = e.isHome ? [e.ourLogo, e.oppLogo] : [e.oppLogo, e.ourLogo];
    const [ls, rs]              = e.isHome ? [us, them]             : [them, us];

    const dateStr = e.date.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
    const timeStr = e.timeValid
        ? e.date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
        : '時刻未定';

    const center = hasScore
        ? `<div class="mw-score">${ls}<span class="mw-score-sep">-</span>${rs}</div>`
        : `<div class="mw-vs">VS</div><div class="mw-ko">${timeStr}</div>`;

    const canOpen = hasScore;

    return `
    <div class="match-card mw-hero ${cls}${canOpen ? ' clickable' : ''}"${canOpen ? ` onclick="openResultDetail('${e.id}')"` : ''}>
        <div class="card-top">
            <span class="league">${e.league}</span>
            <span class="venue">${dateStr}${e.timeValid ? '　' + timeStr : ''}</span>
        </div>
        <div class="mw-hero-body">
            <div class="card-team">
                <img src="${leftLogo}" alt="" onerror="this.style.display='none'">
                <span class="card-team-name${e.isHome ? ' us' : ''}">${left}</span>
            </div>
            <div class="mw-hero-center">
                ${center}
                <span class="result-pill ${pillCls}">${label}</span>
            </div>
            <div class="card-team right">
                <img src="${rightLogo}" alt="" onerror="this.style.display='none'">
                <span class="card-team-name${e.isHome ? '' : ' us'}">${right}</span>
            </div>
        </div>
        <div class="mw-hero-foot">
            <span>${e.venue || ''}</span>
            ${canOpen ? '<span class="mw-more">詳細を見る ›</span>' : ''}
        </div>
    </div>`;
}

// 同じ節の他会場（開催日ごとに区切る）
function otherFixtures(m) {
    if (!m.others.length) return '';
    const byDate = new Map();
    [...m.others]
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .forEach(ev => {
            const key = eventDateInfo(ev).date.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
            if (!byDate.has(key)) byDate.set(key, []);
            byDate.get(key).push(ev);
        });
    return '<div class="section-label">同じ節の他会場</div>' +
        [...byDate.entries()].map(([dateStr, evs]) =>
            `<div class="round-date">${dateStr}</div>${evs.map(fixtureRow).join('')}`).join('');
}

// ---- 節の組み立て ----
// ESPNは節番号を返さないため、日付順に「同じクラブが二度出ない・1節あたり(クラブ数÷2)試合」
// という条件で詰めて節を組み立てる。延期試合も本来の節に吸収される。
function buildRounds(events, perRound) {
    const rounds = [];
    [...events]
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .forEach(ev => {
            const ids = (ev.competitions?.[0]?.competitors || []).map(c => c.team?.id);
            const slot = rounds.find(r =>
                (!perRound || r.events.length < perRound) && !ids.some(id => r.teams.has(id)));
            if (slot) {
                slot.events.push(ev);
                ids.forEach(id => slot.teams.add(id));
            } else {
                rounds.push({ events: [ev], teams: new Set(ids) });
            }
        });
    return rounds.map(r => r.events.sort((a, b) => new Date(a.date) - new Date(b.date)));
}

function eventStatus(ev) {
    const t = ev.competitions?.[0]?.status?.type || {};
    const name = t.name || '';
    return {
        done: t.completed === true || /FULL_TIME|FINAL/.test(name),
        live: t.state === 'in',
    };
}

function fixtureRow(ev) {
    const comp = ev.competitions?.[0];
    if (!comp) return '';
    const home = comp.competitors?.find(c => c.homeAway === 'home');
    const away = comp.competitors?.find(c => c.homeAway === 'away');
    if (!home || !away) return '';

    const { done, live } = eventStatus(ev);
    const hs = home.score?.value != null ? Math.round(home.score.value) : null;
    const as = away.score?.value != null ? Math.round(away.score.value) : null;
    const hasScore = (done || live) && hs !== null && as !== null;

    const mine = home.team?.id === TEAM_ID || away.team?.id === TEAM_ID;
    const nameCls = (team, myScore, oppScore) => {
        if (team?.id === TEAM_ID) return ' mine';
        return hasScore && myScore > oppScore ? ' winner' : '';
    };

    const when = eventDateInfo(ev);
    const middle = hasScore
        ? `<div class="fixture-score${live ? ' fixture-live' : ''}">${hs} - ${as}</div>`
        : `<div class="fixture-time">${when.timeValid
              ? when.date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
              : '時刻未定'}</div>`;

    return `
    <div class="fixture${mine ? ' mine' : ''}">
        <div class="fixture-team">
            <img src="${getLogo(home.team) || LOGO(home.team?.id)}" alt="" onerror="this.style.display='none'">
            <span class="fixture-name${nameCls(home.team, hs, as)}">${toJP(home.team?.displayName)}</span>
        </div>
        ${middle}
        <div class="fixture-team right">
            <img src="${getLogo(away.team) || LOGO(away.team?.id)}" alt="" onerror="this.style.display='none'">
            <span class="fixture-name${nameCls(away.team, as, hs)}">${toJP(away.team?.displayName)}</span>
        </div>
    </div>`;
}

// ---- 試合詳細モーダル ----
function openResultDetail(id) {
    const e = resultEventsMap[id];
    if (!e) return;

    const us = e.ourScore, them = e.oppScore;
    const cls   = us > them ? 'win' : us < them ? 'loss' : 'draw';
    const label = e.live ? 'LIVE' : us > them ? 'WIN' : us < them ? 'LOSE' : 'DRAW';
    const dateStr = e.date.toLocaleDateString('ja-JP', {year:'numeric', month:'long', day:'numeric', weekday:'short'});
    const timeStr = e.timeValid ? e.date.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) : '';
    const [homeName, awayName]   = e.isHome ? [e.ourTeam, e.oppTeam]  : [e.oppTeam, e.ourTeam];
    const [homeLogo, awayLogo]   = e.isHome ? [e.ourLogo, e.oppLogo]  : [e.oppLogo, e.ourLogo];
    const [homeScore, awayScore] = e.isHome ? [us, them]              : [them, us];

    document.getElementById('modal-content').innerHTML = `
        <div class="modal-header">
            <div class="modal-meta">${e.league}　${dateStr} ${timeStr}<br>${e.venue}</div>
            <button class="modal-close" onclick="closeDetail()">✕</button>
        </div>
        <div class="modal-scoreboard">
            <div class="modal-team">
                <img src="${homeLogo}" alt="" onerror="this.style.display='none'">
                <div class="modal-team-name">${homeName}</div>
            </div>
            <div class="modal-score-wrap">
                <div class="modal-score-num">${homeScore}－${awayScore}</div>
                <span class="result-pill ${e.live ? 'live' : cls}">${label}</span>
            </div>
            <div class="modal-team">
                <img src="${awayLogo}" alt="" onerror="this.style.display='none'">
                <div class="modal-team-name">${awayName}</div>
            </div>
        </div>
        <div id="modal-detail-body">
            <div style="text-align:center;padding:24px 0 32px">
                <div class="spinner" style="margin:0 auto"></div>
            </div>
        </div>`;

    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('modal-sheet').classList.add('open');
    document.body.style.overflow = 'hidden';

    fetchAndRenderDetail(e.id, e);
}

function closeDetail() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('modal-sheet').classList.remove('open');
    document.body.style.overflow = '';
}

async function fetchAndRenderDetail(eventId, e) {
    const body = document.getElementById('modal-detail-body');
    if (!body || !eventId) {
        if (body) body.innerHTML = noDetailMsg();
        return;
    }
    try {
        const url  = `https://site.api.espn.com/apis/site/v2/sports/soccer/jpn.1/summary?event=${eventId}`;
        const data = await (await fetch(url)).json();
        // 開発用: コンソールでAPIレスポンスを確認できるようにする
        console.log('[ESPN summary]', JSON.stringify({
            scoringPlays: data.scoringPlays,
            keyEvents: data.keyEvents?.slice(0,3),
            playsFiltered: (data.plays||[]).filter(p=>p.scoringPlay).slice(0,3),
        }, null, 2));
        body.innerHTML = buildDetailBody(data, e);
    } catch(err) {
        console.error('[ESPN summary error]', err);
        body.innerHTML = noDetailMsg();
    }
}

function noDetailMsg() {
    return '<div style="padding:20px 16px 32px;color:#444;font-size:0.8rem;text-align:center">詳細データなし</div>';
}

function buildDetailBody(data, e) {
    let html = '';

    // ── 前半・後半スコア ──
    const hComp = data.header?.competitions?.[0]?.competitors?.find(c => c.homeAway === 'home');
    const aComp = data.header?.competitions?.[0]?.competitors?.find(c => c.homeAway === 'away');
    if (hComp?.linescores?.length) {
        const hLS = hComp.linescores;
        const aLS = aComp?.linescores || [];
        const PERIOD_LABELS = ['前半', '後半', '延長前半', '延長後半'];
        const blocks = hLS.map((_, i) => ({
            label: PERIOD_LABELS[i] || `第${i+1}P`,
            score: `${hLS[i]?.displayValue ?? '?'}－${aLS[i]?.displayValue ?? '?'}`,
        }));
        html += `
        <div class="half-scores">
            ${blocks.map((b, i) => `
                ${i > 0 ? '<span class="half-score-sep">|</span>' : ''}
                <div class="half-score-block">
                    <div class="half-score-label">${b.label}</div>
                    <div class="half-score-num">${b.score}</div>
                </div>`).join('')}
        </div>`;
    }

    // ── 得点 ──
    // ESPN soccer は scoringPlays / keyEvents(filtered) / plays(filtered) の順で探す
    let scoring = data.scoringPlays || [];
    if (!scoring.length) {
        scoring = (data.keyEvents || []).filter(k =>
            k.scoringPlay || /goal/i.test(k.type?.text || k.type?.id || '')
        );
    }
    if (!scoring.length) {
        scoring = (data.plays || []).filter(p => p.scoringPlay === true);
    }

    if (scoring.length) {
        const rows = scoring.map(g => {
            // clock は "45:00"(MM:SS) か "45'"(分) の両形式に対応
            const raw = g.clock?.displayValue || '';
            const min = raw.includes("'") ? raw
                : raw.includes(':')       ? raw.split(':')[0] + "'"
                : raw ? raw + "'"         : '';

            // 得点者名を複数の格納場所から取る
            const pList = g.participants || g.athletesInvolved || [];
            const scorer = pList.find(p => {
                const t = p.type;
                return t === 'scorer'
                    || (typeof t === 'object' && /scor/i.test(t?.text || t?.id || ''));
            }) || pList[0];
            const name = scorer?.athlete?.displayName
                || scorer?.displayName
                || g.text || '不明';

            // team.id は文字列・数値どちらでも比較
            const isOur = String(g.team?.id ?? '') === String(TEAM_ID);
            const isOG  = /own.goal|og\b/i.test(g.type?.text || g.type?.abbreviation || '');
            return `
            <div class="event-row">
                <span class="event-min">${min}</span>
                <span class="event-icon">⚽</span>
                <span class="event-name">${isOG ? '[OG] ' : ''}${name}</span>
                <span class="event-side ${isOur ? 'us' : ''}">${isOur ? e.ourTeam : e.oppTeam}</span>
            </div>`;
        }).join('');
        html += `<div class="modal-section">${rows}</div>`;
    }

    // ── スタッツ ──
    const bTeams = data.boxscore?.teams || [];
    if (bTeams.length >= 2) {
        const homeBox = bTeams.find(t => t.homeAway === 'home') || bTeams[0];
        const awayBox = bTeams.find(t => t.homeAway === 'away') || bTeams[1];
        const leftBox  = e.isHome ? homeBox : awayBox;
        const rightBox = e.isHome ? awayBox : homeBox;

        const sv = (stats, name) => {
            const s = (stats || []).find(x => x.name === name);
            return s != null ? parseFloat(s.displayValue) : null;
        };

        const STATS = [
            { name: 'possessionPct', label: 'ポゼッション', pct: true, bar: true },
            { name: 'totalShots',    label: 'シュート' },
            { name: 'shotsOnTarget', label: '枠内シュート' },
            { name: 'saves',         label: 'セーブ' },
            { name: 'cornersWon',    label: 'コーナー' },
            { name: 'fouls',         label: 'ファウル' },
            { name: 'yellowCards',   label: 'イエロー' },
            { name: 'redCards',      label: 'レッド' },
            { name: 'offsides',      label: 'オフサイド' },
        ];

        const statRows = STATS.map(({ name, label, pct, bar }) => {
            const lv = sv(leftBox.statistics, name);
            const rv = sv(rightBox.statistics, name);
            if (lv === null && rv === null) return '';
            const l = lv ?? 0, r = rv ?? 0;
            const lDisp = pct ? l + '%' : l;
            const rDisp = pct ? r + '%' : r;
            if (bar) {
                return `
                <div class="stat-row">
                    <span class="stat-val left us">${lDisp}</span>
                    <div class="stat-center">
                        <span class="stat-name">${label}</span>
                        <div class="stat-bars">
                            <div class="stat-bar-l" style="flex:${Math.max(l,0.01)}"></div>
                            <div class="stat-bar-r" style="flex:${Math.max(r,0.01)}"></div>
                        </div>
                    </div>
                    <span class="stat-val right">${rDisp}</span>
                </div>`;
            }
            return `
            <div class="stat-simple-row">
                <span class="stat-num left">${lDisp}</span>
                <span class="stat-lbl-center">${label}</span>
                <span class="stat-num right">${rDisp}</span>
            </div>`;
        }).filter(Boolean).join('');

        if (statRows) {
            html += `
            <div class="modal-section">
                <div class="modal-section-title">
                    <span style="color:#FFD700">${e.ourTeam}</span>
                    スタッツ
                    <span>${e.oppTeam}</span>
                </div>
                ${statRows}
            </div>`;
        }
    }

    return html || noDetailMsg();
}


// 任意チームの試合結果を返す（相手フォーム用）
function resultForTeam(ev, teamId) {
    const comp = ev.competitions?.[0];
    if (!comp) return null;
    const sName = comp.status?.type?.name || '';
    const done  = sName === 'STATUS_FULL_TIME' || sName === 'STATUS_FINAL' || sName.startsWith('STATUS_FINAL');
    if (!done) return null;
    const me  = comp.competitors.find(c => c.team?.id === teamId);
    const opp = comp.competitors.find(c => c.team?.id !== teamId);
    if (!me || !opp) return null;
    const ms = me.score?.value != null  ? Math.round(me.score.value)  : NaN;
    const os = opp.score?.value != null ? Math.round(opp.score.value) : NaN;
    if (isNaN(ms) || isNaN(os)) return null;
    return {
        result:  ms > os ? 'w' : ms < os ? 'l' : 'd',
        date:    eventDateInfo(ev).date,
        oppTeam: toJP(opp.team?.displayName),
        score:   `${ms}－${os}`,
        isHome:  me.homeAway === 'home',
    };
}

// 今季対戦成績（前回/前々回… + 右側に通算戦績）
function buildH2H(matches, oppTeam) {
    const noMatch = `
    <div class="form-section">
        <div class="form-label">今季対戦成績 vs ${oppTeam}</div>
        <div style="font-size:0.8rem;color:#444">まだ対戦していません</div>
    </div>`;
    if (!matches.length) return noMatch;

    const w = matches.filter(e => e.ourScore > e.oppScore).length;
    const d = matches.filter(e => e.ourScore === e.oppScore).length;
    const l = matches.filter(e => e.ourScore < e.oppScore).length;
    const LABELS = ['前回対戦', '前々回', '3戦前', '4戦前', '5戦前'];

    const rows = [...matches].reverse().map((e, i) => {
        const cls  = e.ourScore > e.oppScore ? 'w' : e.ourScore < e.oppScore ? 'l' : 'd';
        const lbl  = e.ourScore > e.oppScore ? 'W' : e.ourScore < e.oppScore ? 'L' : 'D';
        // 今季は年をまたぐため年（下2桁）まで出す
        const date = `${String(e.date.getFullYear()).slice(2)}/${e.date.getMonth() + 1}/${e.date.getDate()}`;
        return `
        <div class="h2h-row">
            <span class="h2h-label">${LABELS[i] || (i+1)+'戦前'}</span>
            <span class="h2h-date">${date}</span>
            <span class="h2h-ha">${e.isHome ? 'H' : 'A'}</span>
            <div class="h2h-pill ${cls}">${lbl}</div>
            <span class="h2h-score">${e.ourScore}－${e.oppScore}</span>
        </div>`;
    }).join('');

    return `
    <div class="form-section">
        <div class="form-label">今季対戦成績 vs ${oppTeam}</div>
        <div class="h2h-container">
            <div class="h2h-matches">${rows}</div>
            <div class="h2h-overall">
                <div class="h2h-overall-title">通算戦績</div>
                <div class="h2h-stat w">${w}<span>勝</span></div>
                <div class="h2h-stat d">${d}<span>分</span></div>
                <div class="h2h-stat l">${l}<span>敗</span></div>
            </div>
        </div>
    </div>`;
}

// 両チームの直近5試合フォーム（古い順。各セルに開催日を添える）
function buildFormBoth(ourMatches, oppResults, ourTeam, oppTeam) {
    const shortName = n => n.replace(/F\.?C\.?|レイソル/g, '').trim().slice(0, 5);
    const md   = d => `${d.getMonth() + 1}/${d.getDate()}`;
    const ymd  = d => `${d.getFullYear()}/${md(d)}`;
    const cell = (cls, date, title) => `
        <div class="form-cell" title="${title}">
            <div class="form-pill ${cls}">${cls.toUpperCase()}</div>
            <div class="form-date">${md(date)}</div>
            <div class="form-year">${date.getFullYear()}</div>
        </div>`;

    const ourCells = ourMatches.map(e => cell(
        e.ourScore > e.oppScore ? 'w' : e.ourScore < e.oppScore ? 'l' : 'd',
        e.date,
        `${ymd(e.date)}　${e.isHome ? 'H' : 'A'} vs ${e.oppTeam}　${e.ourScore}－${e.oppScore}`
    )).join('');

    const oppCells = oppResults.map(r => cell(
        r.result,
        r.date,
        `${ymd(r.date)}　${r.isHome ? 'H' : 'A'} vs ${r.oppTeam}　${r.score}`
    )).join('');

    return `
    <div class="form-section">
        <div class="form-label">直近5試合<span class="form-note">左が古い</span></div>
        <div class="form-both-row">
            <span class="form-team-label us">${shortName(ourTeam)}</span>
            <div class="form-row">${ourCells}</div>
        </div>
        ${oppCells ? `
        <div class="form-both-row">
            <span class="form-team-label">${shortName(oppTeam)}</span>
            <div class="form-row">${oppCells}</div>
        </div>` : ''}
    </div>`;
}

// ---- 順位表 ----
async function showStandings(el) {
    const info = await getSeasonInfo();
    const data = info.standings;
    document.getElementById('season-title').textContent = info.label;

    if (!data.children?.length && !data.standings) {
        el.innerHTML = '<div class="error-box">順位表を取得できませんでした</div>';
        return;
    }

    // グループ（東/西）または単一テーブルの両方に対応
    const groups = data.children?.length
        ? data.children
        : [{ name: 'J1リーグ', standings: data.standings }];

    function sv(stats, name) {
        const s = (stats || []).find(x => x.name === name);
        return s ? Math.round(s.value) : 0;
    }

    const html = groups.map(group => {
        const entries = (group.standings?.entries || [])
            .slice()
            .sort((a, b) => sv(a.stats, 'rank') - sv(b.stats, 'rank'));
        const total = entries.length;

        const rows = entries.map(entry => {
            const team  = entry.team || {};
            const stats = entry.stats || [];
            const rank  = sv(stats, 'rank');
            const pts   = sv(stats, 'points');
            const gp    = sv(stats, 'gamesPlayed');
            const w     = sv(stats, 'wins');
            const d     = sv(stats, 'ties');
            const l     = sv(stats, 'losses');
            const gf    = sv(stats, 'pointsFor');
            const ga    = sv(stats, 'pointsAgainst');
            const gd    = gf - ga;
            const isMe  = team.id === TEAM_ID;
            const logo  = getLogo(team) || LOGO(team.id);
            const name  = toJP(team.displayName || '');

            const rankCls = rank <= 3 ? 'rank-top' : rank > total - 3 ? 'rank-rel' : '';
            const gdStr   = gd > 0 ? '+' + gd : String(gd);

            return `
            <tr class="${isMe ? 'me' : ''}">
                <td class="td-rank ${rankCls}">${rank}</td>
                <td class="td-team">
                    <div class="td-team-inner">
                        <img src="${logo}" alt="" onerror="this.style.display='none'">
                        <span class="td-team-name">${name}</span>
                    </div>
                </td>
                <td>${gp}</td>
                <td>${w}</td>
                <td>${d}</td>
                <td>${l}</td>
                <td>${gf}</td>
                <td>${ga}</td>
                <td>${gdStr}</td>
                <td class="td-pts">${pts}</td>
            </tr>`;
        }).join('');

        const label = group.name && groups.length > 1
            ? `<div class="standings-group-label">${group.name}</div>` : '';

        return label + `
        <table class="standings-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th class="th-team">クラブ</th>
                    <th>試</th><th>勝</th><th>分</th><th>負</th>
                    <th>得</th><th>失</th><th>差</th>
                    <th>勝点</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>`;
    }).join('');

    el.innerHTML = `<div class="section-label">${info.label}シーズン 順位表</div>` + html;

    // ヘッダーに柏レイソルの成績を反映
    const allEntries = groups.flatMap(g => g.standings?.entries || []);
    const me = allEntries.find(e => e.team?.id === TEAM_ID);
    if (me) {
        const s    = me.stats || [];
        const rank = sv(s, 'rank');
        const pts  = sv(s, 'points');
        const w    = sv(s, 'wins');
        const d    = sv(s, 'ties');
        const l    = sv(s, 'losses');
        document.getElementById('header-stats').innerHTML = `
            <div class="hstat"><span class="hstat-val">${rank}位</span><span class="hstat-lbl">順位</span></div>
            <div class="hstat-divider"></div>
            <div class="hstat"><span class="hstat-val">${pts}pt</span><span class="hstat-lbl">勝点</span></div>
            <div class="hstat-divider"></div>
            <div class="hstat"><span class="hstat-val">${w}勝${d}分${l}敗</span><span class="hstat-lbl">戦績</span></div>`;
    }
}
