<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柏レイソル</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif;
            background: #0e0f13;
            color: #fff;
            min-height: 100vh;
        }

        /* ── ヘッダー ── */
        header {
            background: linear-gradient(180deg, #1c1700 0%, #0e0f13 100%);
            padding: 24px 24px 20px;
            border-bottom: 1px solid #1e2030;
            position: relative;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700 30%, #FFD700 70%, transparent);
        }
        .header-inner {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .team-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 16px rgba(255,215,0,0.35));
        }
        .header-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .header-info .team-name {
            font-size: 0.72rem;
            font-weight: 600;
            color: #777;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .header-stats {
            display: flex;
            align-items: center;
            gap: 0;
            flex-wrap: wrap;
        }
        .hstat {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0 16px 0 0;
        }
        .hstat:first-child { padding-left: 0; }
        .hstat-val {
            font-size: 1.5rem;
            font-weight: 800;
            color: #FFD700;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        .hstat-lbl {
            font-size: 0.62rem;
            color: #777;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .hstat-divider {
            width: 1px;
            height: 32px;
            background: #252830;
            margin: 0 16px 0 0;
            flex-shrink: 0;
        }

        /* ── タブ ── */
        .tabs {
            display: flex;
            background: #0e0f13;
            border-bottom: 1px solid #1e2030;
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 0 8px;
        }
        .tab {
            padding: 15px 24px;
            cursor: pointer;
            color: #777;
            font-size: 0.85rem;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: color 0.2s;
            user-select: none;
            letter-spacing: 0.02em;
        }
        .tab:hover { color: #aaa; }
        .tab.active { color: #FFD700; border-bottom-color: #FFD700; }

        /* ── コンテンツ ── */
        .content {
            max-width: 680px;
            margin: 0 auto;
            padding: 16px 12px 60px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #666;
            text-transform: uppercase;
            margin: 20px 4px 10px;
        }

        /* ── 試合カード ── */
        .match-card {
            background: #161820;
            border-radius: 12px;
            margin-bottom: 8px;
            overflow: hidden;
            border-left: 3px solid #2a2d3a;
            transition: border-color 0.2s;
        }
        .match-card.win  { border-left-color: #2ecc71; }
        .match-card.loss { border-left-color: #e74c3c; }
        .match-card.draw { border-left-color: #555; }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #12131a;
            font-size: 0.7rem;
            color: #777;
            letter-spacing: 0.04em;
        }
        .card-top .league { color: #888; }
        .card-top .venue  { color: #666; }

        .card-body {
            display: flex;
            align-items: center;
            padding: 14px 14px;
            gap: 6px;
        }
        .card-team {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-team.right {
            flex-direction: row-reverse;
            text-align: right;
        }
        .card-team img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .card-team-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #bbb;
            line-height: 1.3;
        }
        .card-team-name.us { color: #fff; }

        .card-score {
            text-align: center;
            min-width: 88px;
            flex-shrink: 0;
        }
        .score-num {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .result-pill {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 5px;
            letter-spacing: 0.04em;
        }
        .result-pill.win  { background: #0d3320; color: #2ecc71; }
        .result-pill.loss { background: #330d0d; color: #e74c3c; }
        .result-pill.draw { background: #252525; color: #777; }

        /* ── 次の試合カード ── */
        .next-card {
            background: #13150e;
            border: 1px solid #2a2a1a;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }
        .next-card-stripe {
            height: 3px;
            background: linear-gradient(90deg, #FFD700, #ffb300);
        }
        .next-card-body {
            padding: 20px 20px 24px;
        }
        .next-card-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #FFD700;
            margin-bottom: 20px;
        }
        .next-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 22px;
        }
        .next-team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }
        .next-team img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
        }
        .next-team-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }
        .next-vs {
            font-size: 0.85rem;
            font-weight: 800;
            color: #555;
            flex-shrink: 0;
            padding: 0 4px;
        }
        .next-info {
            border-top: 1px solid #222;
            padding-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .next-date {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }
        .next-time {
            font-size: 0.9rem;
            font-weight: 600;
            color: #FFD700;
        }
        .next-venue {
            font-size: 0.78rem;
            color: #777;
            margin-top: 2px;
        }
        /* ── フォーム ── */
        .form-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #222;
        }
        .form-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 10px;
        }
        .form-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .form-pill {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }
        .form-pill.w { background: #0d3320; color: #2ecc71; }
        .form-pill.d { background: #252525; color: #888; }
        .form-pill.l { background: #330d0d; color: #e74c3c; }
        /* ── 両チームフォーム ── */
        .form-both-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .form-both-row:last-child { margin-bottom: 0; }
        .form-team-label {
            font-size: 0.72rem;
            color: #888;
            width: 56px;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .form-team-label.us { color: #FFD700; font-weight: 700; }

        /* ── H2H ── */
        .h2h-container {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .h2h-matches { flex: 1; }
        .h2h-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .h2h-row:last-child { border-bottom: none; }
        .h2h-label { font-size: 0.68rem; color: #777; width: 48px; flex-shrink: 0; }
        .h2h-date  { font-size: 0.72rem; color: #777; width: 36px; flex-shrink: 0; }
        .h2h-ha    { font-size: 0.65rem; color: #666; background: #1e2030; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
        .h2h-pill {
            width: 24px; height: 24px;
            border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.68rem; font-weight: 800;
            flex-shrink: 0;
        }
        .h2h-pill.w { background: #0d3320; color: #2ecc71; }
        .h2h-pill.d { background: #252525; color: #888; }
        .h2h-pill.l { background: #330d0d; color: #e74c3c; }
        .h2h-score { font-size: 0.82rem; font-weight: 700; color: #ddd; }
        .h2h-overall {
            flex-shrink: 0;
            background: #12131a;
            border-radius: 8px;
            padding: 10px 12px;
            text-align: center;
            min-width: 64px;
        }
        .h2h-overall-title {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .h2h-stat {
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 4px;
        }
        .h2h-stat.w { color: #2ecc71; }
        .h2h-stat.d { color: #888; }
        .h2h-stat.l { color: #e74c3c; }
        .h2h-stat span { font-size: 0.65rem; font-weight: 600; color: #666; margin-left: 2px; }

        .next-ha-badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            background: #1e2030;
            color: #888;
            margin-top: 4px;
            letter-spacing: 0.04em;
            align-self: flex-start;
        }

        /* ── 試合カード タップ ── */
        .match-card { cursor: pointer; }
        .match-card:hover { background: #1a1c28; }
        .match-card:active { opacity: 0.8; }

        /* ── 試合詳細モーダル ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 680px;
            margin: 0 auto;
            background: #161820;
            border-radius: 20px 20px 0 0;
            max-height: 94vh;
            overflow-y: auto;
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
        }
        .modal-sheet.open { transform: translateY(0); }
        .modal-handle {
            width: 40px; height: 4px;
            background: #2a2d3a;
            border-radius: 2px;
            margin: 12px auto 0;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 16px 0;
            gap: 8px;
        }
        .modal-meta { font-size: 0.7rem; color: #777; line-height: 1.6; flex: 1; }
        .modal-close {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: #252830;
            border: none;
            color: #888;
            font-size: 0.85rem;
            cursor: pointer;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-scoreboard {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 16px 16px;
            gap: 8px;
        }
        .modal-team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }
        .modal-team img { width: 50px; height: 50px; object-fit: contain; }
        .modal-team-name { font-size: 0.82rem; font-weight: 700; color: #fff; line-height: 1.3; }
        .modal-score-wrap { text-align: center; flex-shrink: 0; }
        .modal-score-num {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            line-height: 1;
        }
        .modal-section {
            padding: 14px 16px;
            border-top: 1px solid #1e2030;
        }
        .modal-section-title {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
        }
        .event-min  { font-size: 0.72rem; color: #FFD700; font-weight: 700; width: 30px; flex-shrink: 0; }
        .event-icon { font-size: 0.9rem; flex-shrink: 0; }
        .event-name { font-size: 0.85rem; color: #ccc; flex: 1; }
        .event-side { font-size: 0.68rem; color: #777; flex-shrink: 0; }
        .stat-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 0;
            border-bottom: 1px solid #1a1c24;
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-val { width: 38px; font-size: 0.82rem; font-weight: 700; color: #888; }
        .stat-val.left  { text-align: right; }
        .stat-val.right { text-align: left; }
        .stat-val.us { color: #FFD700; }
        .stat-center { flex: 1; text-align: center; }
        .stat-name { font-size: 0.68rem; color: #777; display: block; margin-bottom: 5px; }
        .stat-bars { display: flex; height: 4px; border-radius: 2px; overflow: hidden; gap: 2px; }
        .stat-bar-l { background: #FFD700; border-radius: 2px; min-width: 2px; }
        .stat-bar-r { background: #3a4060; border-radius: 2px; min-width: 2px; }
        /* 前半・後半スコア */
        .half-scores {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            padding: 10px 16px 16px;
            border-top: 1px solid #1e2030;
        }
        .half-score-block { text-align: center; padding: 0 20px; }
        .half-score-label {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 4px;
        }
        .half-score-num { font-size: 1.05rem; font-weight: 700; color: #aaa; }
        .half-score-sep { color: #252830; font-size: 1.2rem; }
        /* シンプルスタッツ行（ポゼッション以外） */
        .stat-simple-row {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #1a1c24;
        }
        .stat-simple-row:last-child { border-bottom: none; }
        .stat-num {
            width: 44px;
            font-size: 1rem;
            font-weight: 800;
            color: #ddd;
        }
        .stat-num.left  { text-align: right; color: #FFD700; }
        .stat-num.right { text-align: left;  color: #888; }
        .stat-lbl-center {
            flex: 1;
            text-align: center;
            font-size: 0.72rem;
            color: #777;
        }
        /* 得点チームの色 */
        .event-side.us { color: #FFD700; font-weight: 600; }

        /* ── ローディング / エラー ── */
        .loading {
            text-align: center;
            color: #666;
            padding: 70px 20px;
        }
        .spinner {
            width: 30px; height: 30px;
            border: 3px solid #1e2030;
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { font-size: 0.85rem; letter-spacing: 0.04em; }

        .error-box {
            background: #180e0e;
            border: 1px solid #3a1a1a;
            border-radius: 10px;
            padding: 16px;
            color: #bb5555;
            font-size: 0.85rem;
            line-height: 1.8;
        }

        /* ── 順位表 ── */
        .standings-group-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #666;
            text-transform: uppercase;
            margin: 20px 4px 8px;
        }
        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        .standings-table thead th {
            padding: 8px 6px;
            color: #666;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border-bottom: 1px solid #1e2030;
            text-align: center;
        }
        .standings-table thead th.th-team { text-align: left; padding-left: 10px; }
        .standings-table tbody tr {
            border-bottom: 1px solid #141620;
            transition: background 0.15s;
        }
        .standings-table tbody tr:hover { background: #1a1c28; }
        .standings-table tbody tr.me {
            background: #1c1a00;
            border-left: 2px solid #FFD700;
        }
        .standings-table tbody tr.me:hover { background: #231f00; }
        .standings-table td {
            padding: 10px 6px;
            text-align: center;
            color: #aaa;
        }
        .standings-table td.td-rank {
            color: #777;
            font-weight: 700;
            font-size: 0.78rem;
            width: 28px;
        }
        .standings-table tr.me td.td-rank { color: #FFD700; }
        .standings-table td.td-team {
            text-align: left;
            padding-left: 6px;
        }
        .td-team-inner {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .td-team-inner img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .td-team-name {
            color: #ccc;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }
        .standings-table tr.me .td-team-name { color: #FFD700; font-weight: 700; }
        .standings-table td.td-pts {
            color: #fff;
            font-weight: 800;
            font-size: 0.9rem;
        }
        .standings-table tr.me td.td-pts { color: #FFD700; }
        .rank-top { color: #3ddc78 !important; }
        .rank-rel { color: #e74c3c !important; }

        /* ── 天気予報 ── */
        .weather-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #222;
        }
        .weather-row {
            display: flex;
            gap: 6px;
        }
        .weather-slot {
            flex: 1;
            background: #0e1018;
            border-radius: 8px;
            padding: 8px 4px 10px;
            text-align: center;
            border: 1px solid #1e2030;
            min-width: 0;
        }
        .weather-slot.kickoff {
            border-color: #FFD700;
            background: #1a1700;
        }
        .weather-time {
            font-size: 0.62rem;
            color: #777;
            white-space: nowrap;
        }
        .weather-ko {
            font-size: 0.58rem;
            font-weight: 700;
            color: #FFD700;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }
        .weather-ko-spacer { height: 14px; }
        .weather-emoji { font-size: 1.3rem; line-height: 1.6; }
        .weather-temp {
            font-size: 0.72rem;
            color: #ccc;
            font-weight: 600;
            margin-top: 1px;
        }
        .weather-prob {
            font-size: 0.62rem;
            color: #4fc3f7;
            font-weight: 600;
            margin-top: 1px;
        }
        .weather-prob.high { color: #e74c3c; }
        .weather-prob.mid  { color: #e67e22; }

        @media (max-width: 480px) {
            .tab { padding: 13px 10px; font-size: 0.75rem; }
            .team-logo { width: 76px; height: 76px; }
            .hstat-val { font-size: 1.2rem; }
            .hstat-divider { margin: 0 10px 0 0; }
            .hstat { padding-right: 10px; }
            .next-team img { width: 48px; height: 48px; }
            .card-team img { width: 30px; height: 30px; }
            .td-team-name { max-width: 80px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <img class="team-logo"

function toJP(n)     { return TEAM_JP[n]  || n || ''; }

function leagueJP(s) {
    if (!s) return 'J1リーグ';
    if (s.includes('J1'))                                   return 'J1リーグ';
    if (s.includes('Levain') || s.includes('League Cup'))   return 'ルヴァンカップ';

    if (s.includes('ACL') || s.includes('Champions'))       return 'ACL';

// ---- タブ ----
const loaded = {};
function switchTab(name) {
    document.querySelectorAll('.tab').forEach((el, i) =>
        el.classList.toggle('active', ['standings','results','next'][i] === name));
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'instant' });
    if (!loaded[name]) { loaded[name] = true; load(name); }
}

async function load(name) {
    const el = document.getElementById('tab-' + name);
    try {
        if (name === 'standings') await showStandings(el);
        if (name === 'results')   await showResults(el);
        if (name === 'next')      await showNext(el);
    } catch(e) {
        el.innerHTML = `<div class="error-box">エラー: ${e.message}</div>`;
    }
}

// ---- イベント解析 ----
let scheduleCache = null;
async function getSchedule() {
    if (scheduleCache) return scheduleCache;
    const data = await get('/teams/' + TEAM_ID + '/schedule');
    scheduleCache = data.events || [];
    return scheduleCache;
}

function parseEvent(ev) {
    const comp = ev.competitions?.[0];
    if (!comp) return null;
    const home = comp.competitors.find(c => c.homeAway === 'home');
    const away = comp.competitors.find(c => c.homeAway === 'away');
    const isHome  = home?.team?.id === TEAM_ID;
    const us      = isHome ? home : away;
    const them    = isHome ? away : home;
    const sName   = comp.status?.type?.name || '';
    const done    = sName === 'STATUS_FULL_TIME' || sName === 'STATUS_FINAL' || sName.startsWith('STATUS_FINAL');
    return {
        id:       ev.id || '',
        date:     new Date(ev.date),
        league:   leagueJP(ev.season?.displayName),
        venue:    venueJP(comp.venue?.fullName || ''),
        isHome,
        ourTeam:  toJP(us?.team?.displayName   || '柏レイソル'),
        oppTeam:  toJP(them?.team?.displayName  || ''),
        ourLogo:  getLogo(us?.team)   || LOGO(TEAM_ID),
        oppLogo:  getLogo(them?.team) || LOGO(them?.team?.id),
        oppId:    them?.team?.id   || '',
        ourScore: done && us?.score?.value   != null ? Math.round(us.score.value)   : null,
        oppScore: done && them?.score?.value != null ? Math.round(them.score.value) : null,
        completed: done,
    };
}

// ---- 天気 ----
function wmoToText(code) {
    if (code === 0)                 return { emoji: '☀️',  text: '晴れ' };
    if (code === 1)                 return { emoji: '🌤️', text: '概ね晴れ' };
    if (code === 2)                 return { emoji: '⛅',  text: '一部曇り' };
    if (code === 3)                 return { emoji: '☁️',  text: '曇り' };
    if (code === 45 || code === 48) return { emoji: '🌫️', text: '霧' };
    if (code >= 51 && code <= 57)   return { emoji: '🌦️', text: '霧雨' };
    if (code >= 61 && code <= 67)   return { emoji: '🌧️', text: '雨' };
    if (code >= 71 && code <= 77)   return { emoji: '❄️',  text: '雪' };
    if (code >= 80 && code <= 82)   return { emoji: '🌦️', text: 'にわか雨' };
    if (code === 85 || code === 86) return { emoji: '🌨️', text: 'にわか雪' };
    if (code >= 95)                 return { emoji: '⛈️',  text: '雷雨' };
    return { emoji: '🌡️', text: '不明' };
}

async function fetchWeather(venue, kickoffDate) {
    const coords = STADIUM_COORDS[venue];
    if (!coords) return null;
    const { lat, lon } = coords;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&hourly=weather_code,precipitation_probability,temperature_2m&timezone=Asia%2FTokyo&forecast_days=16`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const times = data.hourly?.time || [];
    const codes = data.hourly?.weather_code || [];
    const probs = data.hourly?.precipitation_probability || [];
    const temps = data.hourly?.temperature_2m || [];
    // キックオフ-2h 〜 キックオフ+3h（試合終了後1h相当）
    const slots = [];
    for (let offset = -2; offset <= 3; offset++) {
        const t  = new Date(kickoffDate.getTime() + offset * 3600 * 1000);
        const y  = t.getFullYear();
        const mo = String(t.getMonth() + 1).padStart(2, '0');
        const d  = String(t.getDate()).padStart(2, '0');
        const h  = String(t.getHours()).padStart(2, '0');
        const key = `${y}-${mo}-${d}T${h}:00`;
        const idx = times.indexOf(key);
        if (idx >= 0) slots.push({ offset, time: t, code: codes[idx], prob: probs[idx] ?? 0, temp: temps[idx] ?? null });
    }
    return slots.length >= 3 ? slots : null;
}

function buildWeather(slots, venue) {
    if (!slots || !slots.length) return '';
    const items = slots.map(s => {
        const { emoji } = wmoToText(s.code);
        const isKO    = s.offset === 0;
        const timeStr = s.time.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        const probCls = s.prob >= 70 ? 'high' : s.prob >= 40 ? 'mid' : '';
        return `
        <div class="weather-slot${isKO ? ' kickoff' : ''}">
            <div class="weather-time">${timeStr}</div>
            ${isKO ? '<div class="weather-ko">KO</div>' : '<div class="weather-ko-spacer"></div>'}
            <div class="weather-emoji">${emoji}</div>
            <div class="weather-temp">${s.temp !== null ? Math.round(s.temp) + '°' : '—'}</div>
            <div class="weather-prob ${probCls}">${s.prob}%</div>
        </div>`;
    }).join('');
    return `
    <div class="weather-section">
        <div class="form-label">スタジアム天気予報</div>
        <div class="weather-row">${items}</div>
    </div>`;
}

// ---- 試合結果 ----
let resultEventsList = [];

async function showResults(el) {
    const events = await getSchedule();
    const past = events.map(parseEvent).filter(e => e && e.completed);
    resultEventsList = past;

    if (!past.length) {
        el.innerHTML = '<div class="error-box">試合結果がありません</div>';
        return;
    }

    el.innerHTML = `<div class="section-label">2026シーズン 試合結果</div>` +
        past.map((e, idx) => {
            const us = e.ourScore, them = e.oppScore;
            const cls    = us > them ? 'win' : us < them ? 'loss' : 'draw';
            const label  = us > them ? 'WIN' : us < them ? 'LOSE' : 'DRAW';
            const date   = e.date.toLocaleDateString('ja-JP', {month:'numeric', day:'numeric', weekday:'short'});
            const [left, right]         = e.isHome ? [e.ourTeam, e.oppTeam]  : [e.oppTeam,  e.ourTeam];
            const [leftLogo, rightLogo] = e.isHome ? [e.ourLogo, e.oppLogo]  : [e.oppLogo, e.ourLogo];
            const [ls, rs]              = e.isHome ? [us, them]              : [them, us];
            const leftUs  = e.isHome;
            const rightUs = !e.isHome;
            return `
            <div class="match-card ${cls}" onclick="openResultDetail(${idx})">
                <div class="card-top">
                    <span class="league">${e.league}</span>
                    <span class="venue">${date}　${e.venue}</span>
                </div>
                <div class="card-body">
                    <div class="card-team">
                        <img src="${leftLogo}" alt="" onerror="this.style.display='none'">
                        <span class="card-team-name${leftUs ? ' us' : ''}">${left}</span>
                    </div>
                    <div class="card-score">
                        <div class="score-num">${ls}　${rs}</div>
                        <span class="result-pill ${cls}">${label}</span>
                    </div>
                    <div class="card-team right">
                        <img src="${rightLogo}" alt="" onerror="this.style.display='none'">
                        <span class="card-team-name${rightUs ? ' us' : ''}">${right}</span>
                    </div>
                </div>
            </div>`;
        }).join('');
}

// ---- 試合詳細モーダル ----
function openResultDetail(idx) {
    const e = resultEventsList[idx];
    if (!e) return;

    const us = e.ourScore, them = e.oppScore;
    const cls   = us > them ? 'win' : us < them ? 'loss' : 'draw';
    const label = us > them ? 'WIN' : us < them ? 'LOSE' : 'DRAW';
    const dateStr = e.date.toLocaleDateString('ja-JP', {year:'numeric', month:'long', day:'numeric', weekday:'short'});
    const timeStr = e.date.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
    const [homeName, awayName]   = e.isHome ? [e.ourTeam, e.oppTeam]  : [e.oppTeam, e.ourTeam];
    const [homeLogo, awayLogo]   = e.isHome ? [e.ourLogo, e.oppLogo]  : [e.oppLogo, e.ourLogo];
    const [homeScore, awayScore] = e.isHome ? [us, them]              : [them, us];

    document.getElementById('modal-content').innerHTML = `
        <div class="modal-header">
            <div class="modal-meta">${e.league}　${dateStr} ${timeStr}<br>${e.venue}</div>
            <button class="modal-close" onclick="closeDetail()">✕</button>
        </div>
        <div class="modal-scoreboard">
            <div class="modal-team">
                <img src="${homeLogo}" alt="" onerror="this.style.display='none'">
                <div class="modal-team-name">${homeName}</div>
            </div>
            <div class="modal-score-wrap">
                <div class="modal-score-num">${homeScore}－${awayScore}</div>
                <span class="result-pill ${cls}">${label}</span>
            </div>
            <div class="modal-team">
                <img src="${awayLogo}" alt="" onerror="this.style.display='none'">
                <div class="modal-team-name">${awayName}</div>
            </div>
        </div>
        <div id="modal-detail-body">
            <div style="text-align:center;padding:24px 0 32px">
                <div class="spinner" style="margin:0 auto"></div>
            </div>
        </div>`;

    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('modal-sheet').classList.add('open');
    document.body.style.overflow = 'hidden';

    fetchAndRenderDetail(e.id, e);
}

function closeDetail() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('modal-sheet').classList.remove('open');
    document.body.style.overflow = '';
}

async function fetchAndRenderDetail(eventId, e) {
    const body = document.getElementById('modal-detail-body');
    if (!body || !eventId) {
        if (body) body.innerHTML = noDetailMsg();
        return;
    }
    try {
        const url  = `https://site.api.espn.com/apis/site/v2/sports/soccer/jpn.1/summary?event=${eventId}`;
        const data = await (await fetch(url)).json();
        // 開発用: コンソールでAPIレスポンスを確認できるようにする
        console.log('[ESPN summary]', JSON.stringify({
            scoringPlays: data.scoringPlays,
            keyEvents: data.keyEvents?.slice(0,3),
            playsFiltered: (data.plays||[]).filter(p=>p.scoringPlay).slice(0,3),
        }, null, 2));
        body.innerHTML = buildDetailBody(data, e);
    } catch(err) {
        console.error('[ESPN summary error]', err);
        body.innerHTML = noDetailMsg();
    }
}

function noDetailMsg() {
    return '<div style="padding:20px 16px 32px;color:#444;font-size:0.8rem;text-align:center">詳細データなし</div>';
}

function buildDetailBody(data, e) {
    let html = '';

    // ── 前半・後半スコア ──
    const hComp = data.header?.competitions?.[0]?.competitors?.find(c => c.homeAway === 'home');
    const aComp = data.header?.competitions?.[0]?.competitors?.find(c => c.homeAway === 'away');
    if (hComp?.linescores?.length) {
        const hLS = hComp.linescores;
        const aLS = aComp?.linescores || [];
        const PERIOD_LABELS = ['前半', '後半', '延長前半', '延長後半'];
        const blocks = hLS.map((_, i) => ({
            label: PERIOD_LABELS[i] || `第${i+1}P`,
            score: `${hLS[i]?.displayValue ?? '?'}－${aLS[i]?.displayValue ?? '?'}`,
        }));
        html += `
        <div class="half-scores">
            ${blocks.map((b, i) => `
                ${i > 0 ? '<span class="half-score-sep">|</span>' : ''}
                <div class="half-score-block">
                    <div class="half-score-label">${b.label}</div>
                    <div class="half-score-num">${b.score}</div>
                </div>`).join('')}
        </div>`;
    }

    // ── 得点 ──
    // ESPN soccer は scoringPlays / keyEvents(filtered) / plays(filtered) の順で探す
    let scoring = data.scoringPlays || [];
    if (!scoring.length) {
        scoring = (data.keyEvents || []).filter(k =>
            k.scoringPlay || /goal/i.test(k.type?.text || k.type?.id || '')
        );
    }
    if (!scoring.length) {
        scoring = (data.plays || []).filter(p => p.scoringPlay === true);
    }

    if (scoring.length) {
        const rows = scoring.map(g => {
            // clock は "45:00"(MM:SS) か "45'"(分) の両形式に対応
            const raw = g.clock?.displayValue || '';
            const min = raw.includes("'") ? raw
                : raw.includes(':')       ? raw.split(':')[0] + "'"
                : raw ? raw + "'"         : '';

            // 得点者名を複数の格納場所から取る
            const pList = g.participants || g.athletesInvolved || [];
            const scorer = pList.find(p => {
                const t = p.type;
                return t === 'scorer'
                    || (typeof t === 'object' && /scor/i.test(t?.text || t?.id || ''));
            }) || pList[0];
            const name = scorer?.athlete?.displayName
                || scorer?.displayName
                || g.text || '不明';

            // team.id は文字列・数値どちらでも比較
            const isOur = String(g.team?.id ?? '') === String(TEAM_ID);
            const isOG  = /own.goal|og\b/i.test(g.type?.text || g.type?.abbreviation || '');
            return `
            <div class="event-row">
                <span class="event-min">${min}</span>
                <span class="event-icon">⚽</span>
                <span class="event-name">${isOG ? '[OG] ' : ''}${name}</span>
                <span class="event-side ${isOur ? 'us' : ''}">${isOur ? e.ourTeam : e.oppTeam}</span>
            </div>`;
        }).join('');
        html += `<div class="modal-section">${rows}</div>`;
    }

    // ── スタッツ ──
    const bTeams = data.boxscore?.teams || [];
    if (bTeams.length >= 2) {
        const homeBox = bTeams.find(t => t.homeAway === 'home') || bTeams[0];
        const awayBox = bTeams.find(t => t.homeAway === 'away') || bTeams[1];
        const leftBox  = e.isHome ? homeBox : awayBox;
        const rightBox = e.isHome ? awayBox : homeBox;

        const sv = (stats, name) => {
            const s = (stats || []).find(x => x.name === name);
            return s != null ? parseFloat(s.displayValue) : null;
        };

        const STATS = [
            { name: 'possessionPct', label: 'ポゼッション', pct: true, bar: true },
            { name: 'totalShots',    label: 'シュート' },
            { name: 'shotsOnTarget', label: '枠内シュート' },
            { name: 'saves',         label: 'セーブ' },
            { name: 'cornersWon',    label: 'コーナー' },
            { name: 'fouls',         label: 'ファウル' },
            { name: 'yellowCards',   label: 'イエロー' },
            { name: 'redCards',      label: 'レッド' },
            { name: 'offsides',      label: 'オフサイド' },
        ];

        const statRows = STATS.map(({ name, label, pct, bar }) => {
            const lv = sv(leftBox.statistics, name);
            const rv = sv(rightBox.statistics, name);
            if (lv === null && rv === null) return '';
            const l = lv ?? 0, r = rv ?? 0;
            const lDisp = pct ? l + '%' : l;
            const rDisp = pct ? r + '%' : r;
            if (bar) {
                return `
                <div class="stat-row">
                    <span class="stat-val left us">${lDisp}</span>
                    <div class="stat-center">
                        <span class="stat-name">${label}</span>
                        <div class="stat-bars">
                            <div class="stat-bar-l" style="flex:${Math.max(l,0.01)}"></div>
                            <div class="stat-bar-r" style="flex:${Math.max(r,0.01)}"></div>
                        </div>
                    </div>
                    <span class="stat-val right">${rDisp}</span>
                </div>`;
            }
            return `
            <div class="stat-simple-row">
                <span class="stat-num left">${lDisp}</span>
                <span class="stat-lbl-center">${label}</span>
                <span class="stat-num right">${rDisp}</span>
            </div>`;
        }).filter(Boolean).join('');

        if (statRows) {
            html += `
            <div class="modal-section">
                <div class="modal-section-title">
                    <span style="color:#FFD700">${e.ourTeam}</span>
                    スタッツ
                    <span>${e.oppTeam}</span>
                </div>
                ${statRows}
            </div>`;
        }
    }

    return html || noDetailMsg();
}

// ---- 次の試合 ----
async function showNext(el) {
    const [teamData, schedule] = await Promise.all([
        get('/teams/' + TEAM_ID),
        getSchedule()
    ]);
    const events = teamData.team?.nextEvent || [];

    if (!events.length) {
        el.innerHTML = '<div class="error-box">予定されている試合はありません</div>';
        return;
    }

    const allPast = schedule.map(parseEvent).filter(e => e && e.completed);
    const p0 = parseEvent(events[0]);

    // 相手の直近5試合と天気を並列取得
    const [oppSchedData, weatherSlots] = await Promise.all([
        p0?.oppId
            ? get('/teams/' + p0.oppId + '/schedule').catch(() => null)
            : Promise.resolve(null),
        p0?.venue
            ? fetchWeather(p0.venue, p0.date).catch(() => null)
            : Promise.resolve(null),
    ]);
    let oppResults = [];
    if (oppSchedData) {
        oppResults = (oppSchedData.events || [])
            .map(ev => resultForTeam(ev, p0.oppId))
            .filter(Boolean)
            .slice(-5);
    }

    el.innerHTML = events.map((ev, i) => {
        const p = parseEvent(ev);
        if (!p) return '';
        const { date, league, isHome, ourTeam, oppTeam, ourLogo, oppLogo, venue, oppId } = p;
        const dateStr = date.toLocaleDateString('ja-JP', {year:'numeric',month:'long',day:'numeric',weekday:'short'});
        const timeStr = date.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});

        if (i === 0) {
            const h2h = allPast.filter(e => e.oppId === oppId);
            return `
            <div class="next-card">
                <div class="next-card-stripe"></div>
                <div class="next-card-body">
                    <div class="next-card-label">${league} · 次の試合</div>
                    <div class="next-teams">
                        <div class="next-team">
                            <img src="${ourLogo}" alt="" onerror="this.style.display='none'">
                            <div class="next-team-name">${ourTeam}</div>
                        </div>
                        <div class="next-vs">VS</div>
                        <div class="next-team">
                            <img src="${oppLogo}" alt="" onerror="this.style.display='none'">
                            <div class="next-team-name">${oppTeam}</div>
                        </div>
                    </div>
                    <div class="next-info">
                        <div class="next-date">${dateStr}</div>
                        <div class="next-time">${timeStr} キックオフ</div>
                        <div class="next-venue">${venue}</div>
                        <span class="next-ha-badge">${isHome ? '🏠  ホームゲーム' : '✈️  アウェイゲーム'}</span>
                    </div>
                    ${buildWeather(weatherSlots, venue)}
                    ${buildH2H(h2h, oppTeam)}
                    ${buildFormBoth(allPast.slice(-5), oppResults, ourTeam, oppTeam)}
                </div>
            </div>`;
        }

        return `
        <div class="match-card">
            <div class="card-top">
                <span class="league">${league}</span>
                <span class="venue">${date.toLocaleDateString('ja-JP', {month:'numeric',day:'numeric',weekday:'short'})}　${timeStr}</span>
            </div>
            <div class="card-body">
                <div class="card-team">
                    <img src="${ourLogo}" alt="" onerror="this.style.display='none'">
                    <span class="card-team-name us">${ourTeam}</span>
                </div>
                <div class="card-score" style="font-size:0.8rem;color:#444;font-weight:700">VS</div>
                <div class="card-team right">
                    <img src="${oppLogo}" alt="" onerror="this.style.display='none'">
                    <span class="card-team-name">${oppTeam}</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

// 任意チームの試合結果を返す（相手フォーム用）
function resultForTeam(ev, teamId) {
    const comp = ev.competitions?.[0];
    if (!comp) return null;
    const sName = comp.status?.type?.name || '';
    const done  = sName === 'STATUS_FULL_TIME' || sName === 'STATUS_FINAL' || sName.startsWith('STATUS_FINAL');
    if (!done) return null;
    const me  = comp.competitors.find(c => c.team?.id === teamId);
    const opp = comp.competitors.find(c => c.team?.id !== teamId);
    if (!me || !opp) return null;
    const ms = me.score?.value != null  ? Math.round(me.score.value)  : NaN;
    const os = opp.score?.value != null ? Math.round(opp.score.value) : NaN;
    if (isNaN(ms) || isNaN(os)) return null;
    return ms > os ? 'w' : ms < os ? 'l' : 'd';
}

// 今季対戦成績（前回/前々回… + 右側に通算戦績）
function buildH2H(matches, oppTeam) {
    const noMatch = `
    <div class="form-section">
        <div class="form-label">今季対戦成績 vs ${oppTeam}</div>
        <div style="font-size:0.8rem;color:#444">まだ対戦していません</div>
    </div>`;
    if (!matches.length) return noMatch;

    const w = matches.filter(e => e.ourScore > e.oppScore).length;
    const d = matches.filter(e => e.ourScore === e.oppScore).length;
    const l = matches.filter(e => e.ourScore < e.oppScore).length;
    const LABELS = ['前回対戦', '前々回', '3戦前', '4戦前', '5戦前'];

    const rows = [...matches].reverse().map((e, i) => {
        const cls  = e.ourScore > e.oppScore ? 'w' : e.ourScore < e.oppScore ? 'l' : 'd';
        const lbl  = e.ourScore > e.oppScore ? 'W' : e.ourScore < e.oppScore ? 'L' : 'D';
        const date = e.date.toLocaleDateString('ja-JP', {month:'numeric', day:'numeric'});
        return `
        <div class="h2h-row">
            <span class="h2h-label">${LABELS[i] || (i+1)+'戦前'}</span>
            <span class="h2h-date">${date}</span>
            <span class="h2h-ha">${e.isHome ? 'H' : 'A'}</span>
            <div class="h2h-pill ${cls}">${lbl}</div>
            <span class="h2h-score">${e.ourScore}－${e.oppScore}</span>
        </div>`;
    }).join('');

    return `
    <div class="form-section">
        <div class="form-label">今季対戦成績 vs ${oppTeam}</div>
        <div class="h2h-container">
            <div class="h2h-matches">${rows}</div>
            <div class="h2h-overall">
                <div class="h2h-overall-title">通算戦績</div>
                <div class="h2h-stat w">${w}<span>勝</span></div>
                <div class="h2h-stat d">${d}<span>分</span></div>
                <div class="h2h-stat l">${l}<span>敗</span></div>
            </div>
        </div>
    </div>`;
}

// 両チームの直近5試合フォーム
function buildFormBoth(ourMatches, oppResults, ourTeam, oppTeam) {
    const pill = cls => `<div class="form-pill ${cls}">${cls.toUpperCase()}</div>`;
    const ourPills = ourMatches.map(e =>
        pill(e.ourScore > e.oppScore ? 'w' : e.ourScore < e.oppScore ? 'l' : 'd')
    ).join('');
    const oppPills = oppResults.map(r => pill(r)).join('');

    const shortName = n => n.replace(/F\.?C\.?|レイソル/g, '').trim().slice(0, 5);

    return `
    <div class="form-section">
        <div class="form-label">直近5試合</div>
        <div class="form-both-row">
            <span class="form-team-label us">${shortName(ourTeam)}</span>
            <div class="form-row">${ourPills}</div>
        </div>
        ${oppPills ? `
        <div class="form-both-row">
            <span class="form-team-label">${shortName(oppTeam)}</span>
            <div class="form-row">${oppPills}</div>
        </div>` : ''}
    </div>`;
}

// ---- 順位表 ----
async function showStandings(el) {
    const url  = 'https://site.web.api.espn.com/apis/v2/sports/soccer/jpn.1/standings?season=2026&seasontype=1&type=0';
    const res  = await fetch(url);
    const data = await res.json();

    // グループ（東/西）または単一テーブルの両方に対応
    const groups = data.children?.length
        ? data.children
        : [{ name: 'J1リーグ', standings: data.standings }];

    function sv(stats, name) {
        const s = (stats || []).find(x => x.name === name);
        return s ? Math.round(s.value) : 0;
    }

    const html = groups.map(group => {
        const entries = (group.standings?.entries || [])
            .slice()
            .sort((a, b) => sv(a.stats, 'rank') - sv(b.stats, 'rank'));
        const total = entries.length;

        const rows = entries.map(entry => {
            const team  = entry.team || {};
            const stats = entry.stats || [];
            const rank  = sv(stats, 'rank');
            const pts   = sv(stats, 'points');
            const gp    = sv(stats, 'gamesPlayed');
            const w     = sv(stats, 'wins');
            const d     = sv(stats, 'ties');
            const l     = sv(stats, 'losses');
            const gf    = sv(stats, 'pointsFor');
            const ga    = sv(stats, 'pointsAgainst');
            const gd    = gf - ga;
            const isMe  = team.id === TEAM_ID;
            const logo  = getLogo(team) || LOGO(team.id);
            const name  = toJP(team.displayName || '');

            const rankCls = rank <= 3 ? 'rank-top' : rank > total - 3 ? 'rank-rel' : '';
            const gdStr   = gd > 0 ? '+' + gd : String(gd);

            return `
            <tr class="${isMe ? 'me' : ''}">
                <td class="td-rank ${rankCls}">${rank}</td>
                <td class="td-team">
                    <div class="td-team-inner">
                        <img src="${logo}" alt="" onerror="this.style.display='none'">
                        <span class="td-team-name">${name}</span>
                    </div>
                </td>
                <td>${gp}</td>
                <td>${w}</td>
                <td>${d}</td>
                <td>${l}</td>
                <td>${gf}</td>
                <td>${ga}</td>
                <td>${gdStr}</td>
                <td class="td-pts">${pts}</td>
            </tr>`;
        }).join('');

        const label = group.name && groups.length > 1
            ? `<div class="standings-group-label">${group.name}</div>` : '';

        return label + `
        <table class="standings-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th class="th-team">クラブ</th>
                    <th>試</th><th>勝</th><th>分</th><th>負</th>
                    <th>得</th><th>失</th><th>差</th>
                    <th>勝点</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>`;
    }).join('');

    el.innerHTML = `<div class="section-label">2026シーズン 順位表</div>` + html;

    // ヘッダーに柏レイソルの成績を反映
    const allEntries = groups.flatMap(g => g.standings?.entries || []);
    const me = allEntries.find(e => e.team?.id === TEAM_ID);
    if (me) {
        const s    = me.stats || [];
        const rank = sv(s, 'rank');
        const pts  = sv(s, 'points');
        const w    = sv(s, 'wins');
        const d    = sv(s, 'ties');
        const l    = sv(s, 'losses');
        document.getElementById('header-stats').innerHTML = `
            <div class="hstat"><span class="hstat-val">${rank}位</span><span class="hstat-lbl">順位</span></div>
            <div class="hstat-divider"></div>
            <div class="hstat"><span class="hstat-val">${pts}pt</span><span class="hstat-lbl">勝点</span></div>
            <div class="hstat-divider"></div>
            <div class="hstat"><span class="hstat-val">${w}勝${d}分${l}敗</span><span class="hstat-lbl">戦績</span></div>`;
    }
}
