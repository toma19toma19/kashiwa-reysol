<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>柏レイソル</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif;
            background: #0e0f13;
            color: #fff;
            min-height: 100vh;
        }

        /* ── ヘッダー ── */
        header {
            background: linear-gradient(180deg, #1c1700 0%, #0e0f13 100%);
            padding: 24px 24px 20px;
            border-bottom: 1px solid #1e2030;
            position: relative;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700 30%, #FFD700 70%, transparent);
        }
        .header-inner {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .team-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 16px rgba(255,215,0,0.35));
        }
        .header-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .header-info .team-name {
            font-size: 0.72rem;
            font-weight: 600;
            color: #777;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .header-stats {
            display: flex;
            align-items: center;
            gap: 0;
            flex-wrap: wrap;
        }
        .hstat {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0 16px 0 0;
        }
        .hstat:first-child { padding-left: 0; }
        .hstat-val {
            font-size: 1.5rem;
            font-weight: 800;
            color: #FFD700;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        .hstat-lbl {
            font-size: 0.62rem;
            color: #777;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .hstat-divider {
            width: 1px;
            height: 32px;
            background: #252830;
            margin: 0 16px 0 0;
            flex-shrink: 0;
        }

        /* ── タブ ── */
        .tabs {
            display: flex;
            background: #0e0f13;
            border-bottom: 1px solid #1e2030;
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 0 8px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 8px;
            cursor: pointer;
            color: #777;
            font-size: 0.85rem;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: color 0.2s;
            user-select: none;
            letter-spacing: 0.02em;
        }
        .tab:hover { color: #aaa; }
        .tab.active { color: #FFD700; border-bottom-color: #FFD700; }

        /* ── コンテンツ ── */
        .content {
            max-width: 680px;
            margin: 0 auto;
            padding: 16px 12px 60px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #666;
            text-transform: uppercase;
            margin: 20px 4px 10px;
        }

        /* ── 試合カード ── */
        .match-card {
            background: #161820;
            border-radius: 12px;
            margin-bottom: 8px;
            overflow: hidden;
            border-left: 3px solid #2a2d3a;
            transition: border-color 0.2s;
        }
        .match-card.win  { border-left-color: #2ecc71; }
        .match-card.loss { border-left-color: #e74c3c; }
        .match-card.draw { border-left-color: #555; }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #12131a;
            font-size: 0.7rem;
            color: #777;
            letter-spacing: 0.04em;
        }
        .card-top .league { color: #888; }
        .card-top .venue  { color: #666; }

        .card-body {
            display: flex;
            align-items: center;
            padding: 14px 14px;
            gap: 6px;
        }
        .card-team {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-team.right {
            flex-direction: row-reverse;
            text-align: right;
        }
        .card-team img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .card-team-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #bbb;
            line-height: 1.3;
        }
        .card-team-name.us { color: #fff; }

        .card-score {
            text-align: center;
            min-width: 88px;
            flex-shrink: 0;
        }
        .score-num {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .result-pill {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 5px;
            letter-spacing: 0.04em;
        }
        .result-pill.win  { background: #0d3320; color: #2ecc71; }
        .result-pill.loss { background: #330d0d; color: #e74c3c; }
        .result-pill.draw { background: #252525; color: #777; }
        .result-pill.live { background: #3a1111; color: #ff5a5a; }
        .result-pill.upcoming { background: #2a2618; color: #FFD700; }

        /* ── 試合結果（1試合ずつ横送り） ── */
        .mw-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #12131a;
            border: 1px solid #1e2030;
            border-radius: 12px;
            padding: 6px 8px;
            margin-bottom: 10px;
            position: sticky;
            top: 51px;
            z-index: 9;
        }
        .mw-btn {
            background: #1c1e28;
            border: none;
            color: #ccc;
            font-size: 0.95rem;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .mw-btn:hover:not(:disabled) { background: #262936; color: #FFD700; }
        .mw-btn:disabled { opacity: 0.25; cursor: default; }
        .mw-label { flex: 1; text-align: center; line-height: 1.25; min-width: 0; }
        .mw-round {
            font-size: 0.9rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.03em;
        }
        .mw-date {
            font-size: 0.68rem;
            font-weight: 600;
            color: #7a7f90;
            margin-top: 2px;
        }
        .mw-back {
            display: block;
            width: 100%;
            background: #1a1c26;
            border: 1px solid #262a38;
            color: #FFD700;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 8px;
            border-radius: 9px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .mw-back:hover { background: #22242f; }

        .mw-view { overflow: hidden; }
        @keyframes mwFromRight { from { opacity: 0; transform: translateX(30px); }  to { opacity: 1; transform: none; } }
        @keyframes mwFromLeft  { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
        .mw-slide.in-right { animation: mwFromRight 0.22s ease-out; }
        .mw-slide.in-left  { animation: mwFromLeft  0.22s ease-out; }

        .match-card.upcoming { border-left-color: #FFD700; }
        .mw-hero { margin-bottom: 4px; }
        .mw-hero.clickable { cursor: pointer; }
        .mw-hero-body {
            display: flex;
            align-items: center;
            padding: 18px 14px 16px;
            gap: 6px;
        }
        .mw-hero .card-team img { width: 46px; height: 46px; }
        .mw-hero .card-team-name { font-size: 0.9rem; }
        .mw-hero-center { text-align: center; min-width: 104px; flex-shrink: 0; }
        .mw-score {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
            color: #fff;
        }
        .mw-score-sep { color: #555; margin: 0 8px; font-weight: 600; }
        .mw-vs { font-size: 1.3rem; font-weight: 800; color: #4a4f60; line-height: 1; }
        .mw-ko { font-size: 0.8rem; font-weight: 700; color: #ccc; margin-top: 6px; }
        .mw-hero-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 9px 14px;
            background: #12131a;
            border-top: 1px solid #1e2030;
            font-size: 0.68rem;
            color: #7a7f90;
        }
        .mw-more { color: #FFD700; font-weight: 700; flex-shrink: 0; }
        .mw-ticket { color: #FFD700; font-weight: 700; flex-shrink: 0; text-align: right; }
        .mw-ticket.tbd { color: #5f6474; font-weight: 600; }   /* 公式ページ未掲載 */

        /* ── 節ごとの試合一覧 ── */
        .round-date {
            font-size: 0.7rem;
            font-weight: 700;
            color: #666;
            letter-spacing: 0.06em;
            margin: 14px 4px 8px;
        }
        .fixture {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #161820;
            border-radius: 10px;
            border-left: 3px solid #2a2d3a;
            padding: 11px 12px;
            margin-bottom: 6px;
        }
        .fixture.mine { border-left-color: #FFD700; background: #191b24; }
        .fixture-team {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .fixture-team.right { flex-direction: row-reverse; text-align: right; }
        .fixture-team img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .fixture-name {
            font-size: 0.78rem;
            font-weight: 600;
            color: #999;
            line-height: 1.25;
        }
        .fixture-name.mine   { color: #FFD700; }
        .fixture-name.winner { color: #fff; }
        .fixture-score {
            min-width: 62px;
            text-align: center;
            flex-shrink: 0;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #eee;
        }
        .fixture-time {
            min-width: 62px;
            text-align: center;
            flex-shrink: 0;
            font-size: 0.75rem;
            font-weight: 700;
            color: #666;
        }
        .fixture-live { color: #e74c3c; }

        /* ── フォーム ── */
        .form-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #222;
        }
        .form-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 10px;
        }
        .form-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .form-pill {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }
        .form-pill.w { background: #0d3320; color: #2ecc71; }
        .form-pill.d { background: #252525; color: #888; }
        .form-pill.l { background: #330d0d; color: #e74c3c; }
        .form-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .form-date {
            font-size: 0.62rem;
            font-weight: 700;
            color: #9aa0b0;
            line-height: 1;
            letter-spacing: 0.01em;
        }
        .form-year {
            font-size: 0.55rem;
            font-weight: 600;
            color: #5f6474;
            line-height: 1;
            margin-top: -1px;
        }
        .form-note {
            font-size: 0.6rem;
            font-weight: 600;
            color: #555;
            letter-spacing: 0.04em;
            text-transform: none;
            margin-left: 8px;
        }
        /* ── 両チームフォーム ── */
        .form-both-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .form-both-row:last-child { margin-bottom: 0; }
        .form-team-label {
            font-size: 0.72rem;
            color: #888;
            width: 56px;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .form-team-label.us { color: #FFD700; font-weight: 700; }

        /* ── H2H ── */
        .h2h-container {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .h2h-matches { flex: 1; }
        .h2h-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .h2h-row:last-child { border-bottom: none; }
        .h2h-label { font-size: 0.68rem; color: #777; width: 44px; flex-shrink: 0; }
        .h2h-date  { font-size: 0.7rem;  color: #777; width: 52px; flex-shrink: 0; }
        .h2h-ha    { font-size: 0.65rem; color: #666; background: #1e2030; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
        .h2h-pill {
            width: 24px; height: 24px;
            border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.68rem; font-weight: 800;
            flex-shrink: 0;
        }
        .h2h-pill.w { background: #0d3320; color: #2ecc71; }
        .h2h-pill.d { background: #252525; color: #888; }
        .h2h-pill.l { background: #330d0d; color: #e74c3c; }
        .h2h-score { font-size: 0.82rem; font-weight: 700; color: #ddd; }
        .h2h-overall {
            flex-shrink: 0;
            background: #12131a;
            border-radius: 8px;
            padding: 10px 12px;
            text-align: center;
            min-width: 64px;
        }
        .h2h-overall-title {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .h2h-stat {
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 4px;
        }
        .h2h-stat.w { color: #2ecc71; }
        .h2h-stat.d { color: #888; }
        .h2h-stat.l { color: #e74c3c; }
        .h2h-stat span { font-size: 0.65rem; font-weight: 600; color: #666; margin-left: 2px; }

        .mw-preview-loading { padding: 26px 0 6px; text-align: center; }
        .mw-preview-loading .spinner { margin: 0 auto; }

        /* ── 試合カード タップ ── */
        .match-card { cursor: pointer; }
        .match-card:hover { background: #1a1c28; }
        .match-card:active { opacity: 0.8; }

        /* ── 試合詳細モーダル ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 680px;
            margin: 0 auto;
            background: #161820;
            border-radius: 20px 20px 0 0;
            max-height: 94vh;
            overflow-y: auto;
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
        }
        .modal-sheet.open { transform: translateY(0); }
        .modal-handle {
            width: 40px; height: 4px;
            background: #2a2d3a;
            border-radius: 2px;
            margin: 12px auto 0;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 16px 0;
            gap: 8px;
        }
        .modal-meta { font-size: 0.7rem; color: #777; line-height: 1.6; flex: 1; }
        .modal-close {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: #252830;
            border: none;
            color: #888;
            font-size: 0.85rem;
            cursor: pointer;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-scoreboard {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 16px 16px;
            gap: 8px;
        }
        .modal-team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }
        .modal-team img { width: 50px; height: 50px; object-fit: contain; }
        .modal-team-name { font-size: 0.82rem; font-weight: 700; color: #fff; line-height: 1.3; }
        .modal-score-wrap { text-align: center; flex-shrink: 0; }
        .modal-score-num {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            line-height: 1;
        }
        .modal-section {
            padding: 14px 16px;
            border-top: 1px solid #1e2030;
        }
        .modal-section-title {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
        }
        .event-min  { font-size: 0.72rem; color: #FFD700; font-weight: 700; width: 30px; flex-shrink: 0; }
        .event-icon { font-size: 0.9rem; flex-shrink: 0; }
        .event-name { font-size: 0.85rem; color: #ccc; flex: 1; }
        .event-side { font-size: 0.68rem; color: #777; flex-shrink: 0; }
        .stat-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 0;
            border-bottom: 1px solid #1a1c24;
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-val { width: 38px; font-size: 0.82rem; font-weight: 700; color: #888; }
        .stat-val.left  { text-align: right; }
        .stat-val.right { text-align: left; }
        .stat-val.us { color: #FFD700; }
        .stat-center { flex: 1; text-align: center; }
        .stat-name { font-size: 0.68rem; color: #777; display: block; margin-bottom: 5px; }
        .stat-bars { display: flex; height: 4px; border-radius: 2px; overflow: hidden; gap: 2px; }
        .stat-bar-l { background: #FFD700; border-radius: 2px; min-width: 2px; }
        .stat-bar-r { background: #3a4060; border-radius: 2px; min-width: 2px; }
        /* 前半・後半スコア */
        .half-scores {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            padding: 10px 16px 16px;
            border-top: 1px solid #1e2030;
        }
        .half-score-block { text-align: center; padding: 0 20px; }
        .half-score-label {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 4px;
        }
        .half-score-num { font-size: 1.05rem; font-weight: 700; color: #aaa; }
        .half-score-sep { color: #252830; font-size: 1.2rem; }
        /* シンプルスタッツ行（ポゼッション以外） */
        .stat-simple-row {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #1a1c24;
        }
        .stat-simple-row:last-child { border-bottom: none; }
        .stat-num {
            width: 44px;
            font-size: 1rem;
            font-weight: 800;
            color: #ddd;
        }
        .stat-num.left  { text-align: right; color: #FFD700; }
        .stat-num.right { text-align: left;  color: #888; }
        .stat-lbl-center {
            flex: 1;
            text-align: center;
            font-size: 0.72rem;
            color: #777;
        }
        /* 得点チームの色 */
        .event-side.us { color: #FFD700; font-weight: 600; }

        /* ── ローディング / エラー ── */
        .loading {
            text-align: center;
            color: #666;
            padding: 70px 20px;
        }
        .spinner {
            width: 30px; height: 30px;
            border: 3px solid #1e2030;
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { font-size: 0.85rem; letter-spacing: 0.04em; }

        .error-box {
            background: #180e0e;
            border: 1px solid #3a1a1a;
            border-radius: 10px;
            padding: 16px;
            color: #bb5555;
            font-size: 0.85rem;
            line-height: 1.8;
        }

        /* ── 順位表 ── */
        .standings-group-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #666;
            text-transform: uppercase;
            margin: 20px 4px 8px;
        }
        .standings-table {
            width: 100%;
